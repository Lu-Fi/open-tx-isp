# t10_binoracle block "apictx" (openimp #539 vendor proof): API handlers (ctx, value, direction, *ret) of the AE / AWB / AF /
# sharpening / output / crop families that the vdiff API sweep only calls with 0 / 1 / 2 / 0x32 / 0x80 / 0xff: random value,
# every direction, a random 0x2fb8-byte ISP context whose fw pointer (+4) points at a random 0x2fd0-byte firmware object,
# stab compared.  Handlers that read ISP registers directly in the vendor (system_isp_read_32 / _GET_* on our side: sinter,
# temper, iridix, ae_roi, awb_roi, ae_exposure, fps_mode ...) need the vdiff register model and are not in this block.
# Large random buffers: fewer cases per function (N=400 by default).
N=${N:-400}
PROVES='ae_compensation ae_freeze ae_gain ae_integrator_set ae_mode ae_split_preset af_mode af_range_high af_range_low af_roi af_status antiflicker_mode antifog_mode antifog_set_preset awb_blue_gain awb_freeze awb_red_gain awb_temperature dis_mode ds1_output_mode ds2_output_mode flash_mode flash_time fr_output_mode histogram_lum image_crop_xoffset image_crop_yoffset image_resize_enable image_resize_height image_resize_width isp_system_state orientation_vflip sharpening_strength'
