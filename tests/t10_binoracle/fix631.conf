# t10_binoracle block "fix631" (openimp #631): the five helpers fixed vendor-equal from the tx-isp-t10.ko asm (same code in
# tx-isp-t20.ko): calc_inv_equidistant_modulation_u16 (ascending u16 tables and arbitrary ones), validate_smooth_test, get_exp
# (lut {entries ptr, count}), is_yuv_format (edge formats as vectors), mem_write_u32 (aligned path; the harness only
# allocates aligned buffers).
PROVES='calc_inv_equidistant_modulation_u16 validate_smooth_test get_exp is_yuv_format mem_write_u32'
FUNCS='
calc_inv_equidistant_modulation_u16 calc_inv_equidistant_modulation_u16 v0 r:0:0xffff kn16:33:0xffff r:1:33
calc_inv_equidistant_modulation_u16 calc_inv_equidistant_modulation_u16 v0 r:0:0xffff buf:72 r:1:33
calc_inv_equidistant_modulation_u16 calc_inv_equidistant_modulation_u16 v0 r:0:16 kn16:9:16 r:1:9
validate_smooth_test validate_smooth_test v0 buf:32 r:-100000:100000
validate_smooth_test validate_smooth_test v0 st:32:8=0,10:16=0,5,15 r:-6:16
get_exp get_exp v0 r:0:20 nest:8:0=[buf:64]:4=0,1,5,16,0xffffffff
is_yuv_format is_yuv_format v0 r:0:0xffff
VEC is_yuv_format 0
VEC is_yuv_format 9
VEC is_yuv_format 10
VEC is_yuv_format 14
VEC is_yuv_format 15
VEC is_yuv_format 268
VEC is_yuv_format 269
VEC is_yuv_format 270
VEC is_yuv_format 271
VEC is_yuv_format 524
VEC is_yuv_format 525
VEC is_yuv_format 526
VEC is_yuv_format 527
VEC is_yuv_format 0xffff
mem_write_u32 mem_write_u32 v0 buf:16 u32
'
MUTATIONS='
@calc_inv_equidistant_modulation_u16:		if (v < table[i])|		if (v <= table[i])
	step = (uint32_t)((int32_t)0x10000 / (int32_t)(n - 1));|	step = (uint32_t)((int32_t)0x10000 / (int32_t)n);
	interp = (int32_t)(step * (i - 1) * (0x100 - frac) + step * i * frac);|	interp = (int32_t)(step * (i - 1) * (0xff - frac) + step * i * frac);
	return limit < (int32_t)diff ? 1 : 0;|	return limit <= (int32_t)diff ? 1 : 0;
	if (!(index < lut[1]))|	if (!(index <= lut[1]))
	if (v >= 0x10d)|	if (v >= 0x10e)
	return (v - 0xa) <= 4U ? 1 : 0;|	return (v - 0xa) <= 5U ? 1 : 0;
		*(uint32_t *)addr = value;|		*(uint32_t *)addr = value + 1;
'
