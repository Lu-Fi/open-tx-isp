# t10_binoracle block "helpers" (openimp #539 vendor proof): firmware helpers the vdiff scenarios never call:
# get_index (AWB mesh axis search, length from _GET_LEN(226): recorded, lengths 2..32), validate_borders (DIS block
# border test, 5th argument on the stack), matrix_vector_multiply (Q8 int16 matrix x u16 vector).
# Same file has more helpers that DIFFER from the vendor and are left out until fixed: openimp #631.
PROVES='get_index validate_borders matrix_vector_multiply'
FUNCS='
get_index get_index v0 r:-40000:40000 s32s:16:-30000:30000
CALLS _GET_LEN:1=2,3,4,8,9,17,32
validate_borders validate_borders v0 r:-50:2000 r:-50:2000 r:-10:2000 r:-10:2000 r:-5:100
VEC validate_borders 50 20 60 100 10
VEC validate_borders 51 20 60 100 10
VEC validate_borders 20 90 300 100 10
VEC validate_borders 20 91 300 100 10
VEC validate_borders 10 10 300 300 10
VEC validate_borders 50 5 60 100 10
VEC validate_borders 5 90 300 100 10
matrix_vector_multiply matrix_vector_multiply v0 buf:32 buf:8 out:8 r:0:4 r:0:4
'
MUTATIONS='
		if (value < axis[i])|		if (value <= axis[i])
	return len - 2;|	return len - 1;
		if (width - border >= x)|		if (width - border > x)
	if (height - border < y)|	if (height - border <= y)
		out[row] = (int16_t)sum;|		out[row] = (int16_t)(sum + 1);
				(int32_t)vector[col]) >> 8;|				(int32_t)vector[col]) >> 7;
'
