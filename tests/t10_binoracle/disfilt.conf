# t10_binoracle block "disfilt" (openimp #539 vendor proof): DIS settings / IIR filter helpers, the AWB identity matrix and
# the ISP sequence readers (vdiff calls them once or never): dis_get_settings, dis_reset (-> iir_filter_reset),
# dis_close, iir_filter_reset, awb_set_identity, sequence_read_u16 / sequence_read_u32 (64-bit return in v0:v1).
PROVES='dis_get_settings dis_reset dis_close iir_filter_reset awb_set_identity sequence_read_u16 sequence_read_u32'
FUNCS='
dis_get_settings dis_get_settings v0 buf:256 out:256
dis_reset dis_reset v0 buf:256
dis_close dis_close v0 u32
iir_filter_reset iir_filter_reset v0 buf:256
awb_set_identity awb_set_identity v0 buf:4096
sequence_read_u16 sequence_read_u16 v0v1 buf:16
sequence_read_u32 sequence_read_u32 v0v1 buf:16
'
MUTATIONS='
	memcpy((void *)settings, (const void *)(dis + 4), 32);|	memcpy((void *)settings, (const void *)(dis + 8), 32);
	filter->limit_lo = 0x14;|	filter->limit_lo = 0x15;
	memset(filter->clear, 0, 0xcc);|	memset(filter->clear, 0, 0xc8);
	matrix[4] = 0x100;|	matrix[4] = 0x101;
	return dis ? 0 : -1;|	return dis ? 0 : -2;
    uint32_t high = (uint32_t)bytes[1] << 8;|    uint32_t high = (uint32_t)bytes[1] << 9;
'
