# t32_cdnsf_oracle: CDNS per-frame paths (par/refresh/dn/wake_up)
# (Matt Davis' recovered C, PR #15 @ 2e2e06bc)
# fn_...760b8_tisp_cdns_refresh.c (= par_refresh(ch, gain, 256)) is left out:
# its ref declares `extern int tisp_cdns_par_refresh()` and no longer
# compiles under C23; the oracle calls par_refresh with 256 instead.
REFS="fn_0000000000076028_tisp_cdns_par_refresh.c fn_0000000000076200_tisp_cdns_dn_params_refresh.c fn_0000000000076320_tisp_cdns_wake_up.c fn_0000000000075fd0_tisp_cdns_intp_reg_refresh.c fn_0000000000075c5c_tisp_cdns_intp.c fn_0000000000075c34_tisp_cdns_reg_trig.c fn_0000000000075890_tisp_cdns_reg_cfg.c fn_000000000001df70_tisp_simple_intp_uint8.c fn_000000000001c790_tisp_reg_write.c"
HDR=tx_isp_t32_cdns.h
MUTATIONS='s|if (old == (u32)-1)|if (old == (u32)-2)|
s|if (diff >= threshold)|if (diff > threshold)|
s|gain, 256U, w|gain, 257U, w|
s|ctx->gain = gain;|ctx->gain = gain + 0x10000;|
/static inline void t32_cdns_intp(/,/^}/s|for (k = 0; k < 39; k++)|for (k = 0; k < 38; k++)|
/static inline void t32_cdns_intp(/,/^}/s|ctx->sec + t32_cdns_map\[k\]\[0\]|ctx->sec + t32_cdns_map[k][1]|
s|ctx->sec = tuning_base + 0xcfa0;|ctx->sec = tuning_base + 0xcfa1;|
s|T32_FWR(w, \*n, 0x12010, 1);|T32_FWR(w, *n, 0x12010, 2);|
/static inline void t32_cdns_intp_reg_refresh/,/^}/s|t32_cdns_reg_trig(w, n);|t32_cdns_reg_cfg(ctx->sec, ctx->param, w, n);|
s|u32 diff = gain > old ? gain - old : old - gain;|u32 diff = gain > old ? gain - old : old - gain - 1;|
s|t32_cdns_reg_cfg(ctx->sec, ctx->param, w, &n);|t32_cdns_reg_cfg(ctx->sec, ctx->param, w, \&n); t32_cdns_reg_trig(w, \&n);|
s|t32_cdns_intp_reg_refresh(ctx, ch, ctx->gain, w, &n);|t32_cdns_intp_reg_refresh(ctx, ch, ctx->gain + 0x10000, w, \&n);|
/static inline int t32_cdns_par_refresh(/,/^}/s|return (int)n;|return (int)n - 1;|'

