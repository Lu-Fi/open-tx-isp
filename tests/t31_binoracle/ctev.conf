# t31_binoracle block "ctev": tisp_ct_update (CCM 0x200 / LSC 0x40 / BCSH 0x10000 gates) and tisp_ev_update
# (unchanged-EV skip, ADR 0x80 / defog 0x800 / WDR 0x8 gates, call order, ev_last store) (openimp #532)
SRC=ctev.c
PROVES='tisp_ct_update tisp_ev_update'
FUNCS='
tisp_ct_update            bo_tisp_ct_update            v0   u32 u32
tisp_ev_update            bo_tisp_ev_update            v0   r:0:2 r:0:2
CALLS system_reg_read:1=0,0x80,0x800,0x8,0x200,0x40,0x10000,0x10a48,0xffffffff,0xfffef5b7 tisp_ccm_ct_update:2 tisp_lsc_ct_update:2 tisp_bcsh_ct_update:2 tisp_awb_ev_update:2 tisp_ccm_ev_update:2 tisp_adr_ev_update:2 tisp_defog_ev_update:2 tisp_bcsh_ev_update:2 tisp_wdr_ev_update:2
GLOBAL ev_last o_ev_last 8 w:0:0,1,2 w:4:0,1,2
'
MUTATIONS='
tx_isp_t31_ctev.h|	if (!(byp & 0x200))|	if (!(byp & 0x100))
tx_isp_t31_ctev.h|	if (!(byp & 0x40))|	if (!(byp & 0x20))
tx_isp_t31_ctev.h|	if (!(byp & 0x10000))|	if (1)
tx_isp_t31_ctev.h|	if (last[0] == ev && last[1] == aux)|	if (0)
tx_isp_t31_ctev.h|	if (last[0] == ev && last[1] == aux)|	if (last[0] == ev || last[1] == aux)
tx_isp_t31_ctev.h|	if (!(byp & 0x80))|	if (!(byp & 0x800))
tx_isp_t31_ctev.h|	if (!(byp & 0x800))|	if (!(byp & 0x80))
tx_isp_t31_ctev.h|	if (!(byp & 0x8))|	if (!(byp & 0x4))
tx_isp_t31_ctev.h|	T31_EV_BCSH(ev, aux);|	T31_EV_BCSH(ev, ev);
tx_isp_t31_ctev.h|	last[1] = aux;|	last[1] = ev;
'
