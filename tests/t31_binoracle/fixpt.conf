'
MUTATIONS='
tx_isp_t31_fixvendor.h|mask = 0xffffffffU >> ((32U - s) & 31U);|mask = (1U << s) - 1U;
tx_isp_t31_fixvendor.h|			f <<= (q - 1 - i) & 31U;|			f <<= (q - i) & 31U;
tx_isp_t31_fixvendor.h|		} else if (d == r) {|		} else if (0) {
tx_isp_t31_fixvendor.h|		return t[frac << ((5 - sh) & 31U)] >> ((30 - ob - ip) & 31U);|		return t[frac << ((5 - sh) & 31U)] >> ((31 - ob - ip) & 31U);
