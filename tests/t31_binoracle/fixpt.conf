# 3000 at #563).  q / shift / base 0..31, divisor >= 1 (the vendor traps on 0).
SRC=fixpt.c
PROVES='fix_point_mult2_32 fix_point_mult3_32 fix_point_div_32 tisp_math_exp2'
FUNCS='
fix_point_mult2_32 bo_fix_point_mult2_32 v0 r:0:31 u32 u32
