# t31_binoracle block "bcshtr": tisp_bcsh_ev_update / tisp_bcsh_ct_update, the BCSH re-run triggers
# (vendor locals cm_ev.31983 / cm_ct.31987 are the compare values; BCSH_real, unsigned |now - last| > threshold, ev >> 10, BCSH_real cleared, last stored) (openimp #533)
SRC=bcshtr.c
PROVES='tisp_bcsh_ev_update tisp_bcsh_ct_update'
FUNCS='
tisp_bcsh_ev_update       bo_tisp_bcsh_ev_update       v0   r:0:0x9000
tisp_bcsh_ct_update       bo_tisp_bcsh_ct_update       v0   r:0:40
CALLS tiziano_bcsh_update:0
GLOBAL BCSH_real o_blk 20 w:0:0,1,2 w:4:0,1,5,16,32,0xffffffff w:8:0,1,4,16,0xffffffff w:12:0,1,5,16,40,0xffffffff w:16:0,1,4,16,0xffffffff
GLOBAL cm_ev.31983 o_cm_ev 4
GLOBAL cm_ct.31987 o_cm_ct 4
GLOBAL BCSH_ev o_raw_ev 4
GLOBAL BCSH_ct o_raw_ct 4
'
MUTATIONS='
tx_isp_t31_ctev.h|	if (*real != 1) {|	if (*real == 0) {
tx_isp_t31_ctev.h|		if (!(thr < d))|		if (!(thr <= d))
tx_isp_t31_ctev.h|		d = *last < now ? now - *last : *last - now;|		d = now - *last;
tx_isp_t31_ctev.h|	*real = 0;|	*real = *real;
tx_isp_t31_ctev.h|	*last = *nowp;|	*last = *last;
tx_isp_t31_ctev.h|	return t31_bcsh_trig(ev >> 10, real, last, thr, now);|	return t31_bcsh_trig(ev >> 9, real, last, thr, now);
tx_isp_t31_ctev.h|	*raw = ct;|	*raw = 0;
'
