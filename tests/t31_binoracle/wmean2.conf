# bright/dark mix ratios, 900-byte zone copy; correction path when awb +0x24 != 0 and corr mode != 1) of
# driver/t31/tx_isp_tuning.c (extracted, EXTRACT) vs the vendor tx-isp-t31.ko (openimp #553).  Grid 1..15 x 1..15,
# zone sums in the range of real 8-bit statistics.
# Not in the t31 make targets yet: FAILs on next 48fe9b223 (openimp #553 finding, see the issue): the vendor accumulates
