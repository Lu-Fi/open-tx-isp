# t33_binoracle block "sharp": tisp_set_sharpness (YSP strength tables, refresh, register stores; the DMSC part is block dsharp) vs the vendor tx-isp-t33.ko instructions (openimp #707)
SRC=sharp.c
FUNCS='
CALLS tisp_dmsc_sharpness_set:2 tisp_ysp_bin_data_refresh:1 tisp_ysp_reg_data_refresh:1 tisp_rcfg_get_dma_state:1=0,0,0,1 tisp_reg_write_t33:4 tisp_mdns_decode_reg_write:2 tisp_simple_intp_uint8_t:3=1,63,511,128,5,65535,74565 tisp_simple_intp_uint16_t:3=7,255,4095,16383,3,70000,129
GLOBAL yspInfo yspInfo 16 q:0:2208:b2176=0,255:b2177=0,128,255:b2178=0,1,2,255:b2179=0,0,0,255:@2172=2724
GLOBAL ysp_paramsP ysp_paramsP 16 q:0:2724
GLOBAL ysp_ratio ysp_ratio 4
GLOBAL yspCfgMode yspCfgMode 1 w:0:0,1
GLOBAL tispYspRefresh tispYspRefresh 1
VEC tisp_set_sharpness 0 0
VEC tisp_set_sharpness 0 128
VEC tisp_set_sharpness 0 129
VEC tisp_set_sharpness 0 255
tisp_set_sharpness bo_tisp_set_sharpness none r:0:0 u32
'
MUTATIONS='
tx_isp_t33_sharp.h|u32 l = level & 0xff,|u32 l = level & 0x7f,
tx_isp_t33_sharp.h|l <= 128 ?|l <= 129 ?
tx_isp_t33_sharp.h|(u8)((o[p] * l) >> 7)|(u8)((o[p] * l) >> 6)
tx_isp_t33_sharp.h|(int)(255 - o[p]) * d) >> 7|(int)(254 - o[p]) * d) >> 7
tx_isp_t33_sharp.h|#define T33_SHARP_BASE		0x454|#define T33_SHARP_BASE		0x455
tx_isp_t33_sharp.h|#define T33_SHARP_TABS		32|#define T33_SHARP_TABS		31
tx_isp_t33_sharp.h|ysp_ratio = l;|ysp_ratio = level;
tx_isp_t33_sharp.h|i = (u32)((int)gain >> 16);|i = gain >> 16;
tx_isp_t33_sharp.h|if (tisp_rcfg_get_dma_state(14)) {|if (tisp_rcfg_get_dma_state(13)) {
tx_isp_t33_sharp.h|tispYspRefresh = 2;|tispYspRefresh = 3;
tx_isp_t33_sharp.h|tispYspRefresh = 1;|tispYspRefresh = 0;
tx_isp_t33_sharp.h|t33_ysp_wr(c, 6, 4172,|t33_ysp_wr(c, 7, 4172,
tx_isp_t33_sharp.h|t33_ysp_wr(c, 43, 4648,|t33_ysp_wr(c, 43, 4644,
tx_isp_t33_sharp.h|yspInfo[c] + 1068 / 4|yspInfo[c] + 1072 / 4
tx_isp_t33_sharp.h|tisp_dmsc_sharpness_set(ch, l);|tisp_dmsc_sharpness_set(ch, level);
'
