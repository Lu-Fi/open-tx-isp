# t33_binoracle block "tgA": AWB / AF gain update entry points vs the vendor tx-isp-t33.ko instructions
SRC=tgA.c
PROVES=''
FUNCS='
tisp_awb_tgain_update     bo_tisp_awb_tgain_update     none r:0:3 r:0:3 r:0:4294967295
tisp_awb_ev_update        bo_tisp_awb_ev_update        v0   r:0:3 r:0:3 r:0:4294967295
tisp_af_tgain_update      bo_tisp_af_tgain_update      none r:0:3 r:0:4294967295
CALLS tisp_awb_set_regional_threshold:1 tisp_awb_set_lum_th_freq:1
GLOBAL awbInfo awbInfo 16 q:0:8:z:@4=0x10438 q:4:8:z:@4=0x10438 q:8:8:z:@4=0x10438 q:12:8:z:@4=0x10438
GLOBAL total_gain total_gain 16
GLOBAL tispAwbRefresh tispAwbRefresh 1
VEC tisp_awb_tgain_update 0 0 0
VEC tisp_awb_tgain_update 3 3 0
VEC tisp_awb_ev_update 0 0 0
VEC tisp_awb_ev_update 3 3 0
VEC tisp_af_tgain_update 0 0
VEC tisp_af_tgain_update 3 0
'
MUTATIONS='
tx_isp_t33_tgA.h|	state[T33_AWB_W_TGAIN] = tgain;|	state[T33_AWB_W_TGAIN] = tgain + 1;
tx_isp_t33_tgA.h|	*refresh = 1;|	*refresh = 2;
tx_isp_t33_tgA.h|	state[T33_AWB_W_EV] = ev >> 10;|	state[T33_AWB_W_EV] = ev >> 11;
tx_isp_t33_tgA.h|	return 0;|	return 1;
tx_isp_t33_tgA.h|	total_gain[ch] = gain;|	total_gain[ch] = gain + 1;
tx_isp_t33_tgA.h|#define T33_AWB_W_TGAIN		((0x10000 + 0x434) / 4)|#define T33_AWB_W_TGAIN		((0x10000 + 0x430) / 4)
tx_isp_t33_tgA.h|#define T33_AWB_W_EV		((0x10000 + 0x430) / 4)|#define T33_AWB_W_EV		((0x10000 + 0x434) / 4)
tx_isp_t33_tgA.h|	u32 *state = (u32 *)(uintptr_t)awb_info[ch][1];|	u32 *state = (u32 *)(uintptr_t)awb_info[ch][0];
tx_isp_t33_tgA.h|	state[T33_AWB_W_TGAIN] = tgain;|	state[T33_AWB_W_TGAIN] = tgain << 1;
'
