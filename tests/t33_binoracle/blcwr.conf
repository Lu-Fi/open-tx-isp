# t33_binoracle block "blcwr": BLC list write (tisp_blc_write_reg) vs the vendor tx-isp-t33.ko (openimp #99)
# blc_para[0]: sec (144 B, byte 128 the enable bit), cp (44 B: the eight channel pointers point into its level
# words at +32..+40, u16 gain at +42); cfg mode 0 (registers) and 1 (slot indexes), list idle / busy.
SRC=blcwr.c
PROVES=''
FUNCS='
tisp_blc_write_reg         bo_tisp_blc_write_reg         v0   r:0:0
CALLS tisp_rcfg_get_dma_state:1=0,0,1 tisp_reg_write_t33:4
GLOBAL blc_para blc_para 4 q:0:85:@0=144:@8=44/p0=32,34,36,38,40/p4=32,34,36,38,40/p8=32,34,36,38,40/p12=32,34,36,38,40/p16=32,34,36,38,40/p20=32,34,36,38,40/p24=32,34,36,38,40/p28=32,34,36,38,40
GLOBAL blcCfgMode blcCfgMode 1 w:0:0,1
GLOBAL tispBlcRefresh tispBlcRefresh 1
'
MUTATIONS='
tx_isp_t33_blcsw.h|	if (hw->dma_state(4)) {|	if (hw->dma_state(5)) {
tx_isp_t33_blcsw.h|		*refresh = 2;|		*refresh = 3;
tx_isp_t33_blcsw.h|	*refresh = 1;|	*refresh = 2;
tx_isp_t33_blcsw.h|cfg ? 3 : 0x3044|cfg ? 4 : 0x3044
tx_isp_t33_blcsw.h|cfg ? 4 : 0x3048|cfg ? 4 : 0x304c
tx_isp_t33_blcsw.h|cfg ? 8 : 0x3058|cfg ? 7 : 0x3058
tx_isp_t33_blcsw.h|cfg ? 6 : 0x3050, t33_blc_pair(b->cp, 3)|cfg ? 6 : 0x3050, t33_blc_pair(b->cp, 2)
tx_isp_t33_blcsw.h|cfg ? 1 : 0x3010, 3)|cfg ? 1 : 0x3010, 1)
tx_isp_t33_blcsw.h|b->sec[128] & 1|b->sec[129] & 1
tx_isp_t33_blcsw.h|b->cp + 42) & 0x1fff|b->cp + 42) & 0xfff
tx_isp_t33_blcsw.h|(t32_tp_le16(hi) & 0xfff) << 16|(t32_tp_le16(hi) & 0xfff) << 12
tx_isp_t33_blcsw.h|t33_le32(cp + 8 * k + 4)|t33_le32(cp + 8 * k)
'
