tx_isp_t33_intp.h|		if (ev < t33_le32(e + 4 * k))|		if (ev > t33_le32(e + 4 * k))
tx_isp_t33_intp.h|	hi = t33_le32(e + 4 * k);|	hi = t33_le32(e + 4 * k + 4);
tx_isp_t33_intp.h|	lo = t33_le32(k + 4 * i);|	lo = t33_le32(k + 4 * i - 4);
tx_isp_t33_intp.h|	if (i >= 10)|	if (i > 10)
tx_isp_t33_intp.h|	if (a == b)|	if (a != b)
tx_isp_t33_intp.h|	p = d * f;|	p = d * (f >> 1);
tx_isp_t33_intp.h|	r = (p >> 16) + ((p >> 15) & 1);|	r = (p >> 16);
tx_isp_t33_intp.h|	return (u16)(up ? a + r : a - r);|	return (u16)(up ? a - r : a + r);
