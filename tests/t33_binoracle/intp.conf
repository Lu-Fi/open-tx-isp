# t33_binoracle block "intp": signed EV / bit-value interpolators + simple u16 (openimp #99)
SRC=intp.c
PROVES='tisp_sub_interp'
FUNCS='
tisp_ev_intp_int8_t        bo_tisp_ev_intp_int8_t        s16  r:0:2097152 kn:11:2097152 buf:11
tisp_bv_intp_int8_t        bo_tisp_bv_intp_int8_t        s16  r:0:2097152 s32s:11:0:2097152 buf:11
tisp_simple_intp_uint16_t  bo_tisp_simple_intp_uint16_t  u16  r:0:11 r:0:65535 buf:22
VEC tisp_simple_intp_uint16_t 0 0
VEC tisp_simple_intp_uint16_t 9 65535
VEC tisp_simple_intp_uint16_t 10 0
VEC tisp_simple_intp_uint16_t 11 0
'
MUTATIONS='
tx_isp_t33_intp.h|		return (signed char)t[10];|		return (signed char)t[9];
tx_isp_t33_intp.h|		return (signed char)t[0];|		return (signed char)t[1];
tx_isp_t33_intp.h|		if (t33_le32(k + 4 * i) < v)|		if (t33_le32(k + 4 * i) > v)
