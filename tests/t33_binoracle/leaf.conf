# t33_binoracle block "leaf": small T33-only helpers vs the vendor tx-isp-t33.ko instructions (openimp #99)
# SRC = wrapper (vendor calling convention), HDRS = the driver headers the mutations edit,
# FUNCS = t33_binoracle.py spec (VENDOR OURS RET ARGS..., see tools/ko_emu/t33_binoracle.py),
# MUTATIONS = one "HDR|from|to" per line (literal text, first occurrence); every mutant must be detected.
# PROVES = further T33-only vendor functions the compared results depend on (callees run inside the vendor code).
# FUNCS / PROVES name T33-only functions only (no T32 namesake): openimp tools/status_driver_port.py counts them.
SRC=leaf.c
PROVES='tisp_sqrt'
FUNCS='
tisp_sub_interp            bo_tisp_sub_interp            v0   r:0:4096 r:-65536:65536 r:-65536:65536
tisp_ev_intp_uint8_t       bo_tisp_ev_intp_uint8_t       u8   r:0:2097152 kn:11:2097152 buf:11
tisp_sqrt_round            bo_tisp_sqrt_round            v0   u64
func_mdns_fixpoint_sqrt    bo_func_mdns_fixpoint_sqrt    v0   sq:4194304 r:1:8192 r:0:20
cti_func_slope_calc        bo_cti_func_slope_calc        none r:-1024:1024 r:-16:65536 out:4 out:4
func_sort_L2H              bo_func_sort_L2H              none s32s:16:-1000:1000 r:-1:16
find_k_n                   bo_find_k_n                   none u32 out:1 out:1
VEC cti_func_slope_calc 0 4096
VEC cti_func_slope_calc 128 2048
VEC cti_func_slope_calc -256 8192
VEC cti_func_slope_calc 255 1
VEC func_mdns_fixpoint_sqrt 10100 100 0
VEC func_mdns_fixpoint_sqrt 10100 1 20
VEC func_mdns_fixpoint_sqrt 10099 1 20
'
MUTATIONS='
tx_isp_t33_blk.h|return a + ((int)x >> 12) + (int)((x >> 11) & 1);|return a + ((int)x >> 12);
tx_isp_t33_blk.h|		return t[10];|		return t[9];
tx_isp_t33_blk.h|	lo = t33_le32(e + 4 * k - 4);|	lo = t33_le32(e + 4 * k - 8);
tx_isp_t33_blk.h|	f = (unsigned long long)(ev - lo) * 0x1000 + (d >> 1);|	f = (unsigned long long)(ev - lo) * 0x1000;
tx_isp_t33_lsc.h|	return (u32)((r >> 1) + (r & 1));|	return (u32)(r >> 1);
tx_isp_t33_blk.h|	if (c * c / 4 <= x)|	if (c * c / 4 < x)
tx_isp_t33_blk.h|		y = (x / g + g + 1) / 2;|		y = (x / g + g) / 2;
tx_isp_t33_blk.h|	if (q < 0x101) {|	if (q < 0x100) {
tx_isp_t33_blk.h|	q = ((0x100 - x) * 0x1000 + (y >> 1)) / y;|	q = ((0x100 - x) * 0x1000) / y;
tx_isp_t33_mdns.h|	for (i = 0; i < n; i++)|	for (i = 1; i < n; i++)
tx_isp_t33_mdns.h|		for (j = 0; j < n - 1 - i; j++)|		for (j = 0; j < n - 2 - i; j++)
tx_isp_t33_osd.h|		*k = 0xcc;|		*k = 0xcd;
tx_isp_t33_osd.h|	int lo = 0, hi = 0x3e, mid = 0x3e;|	int lo = 0, hi = 0x3d, mid = 0x3e;
'
