# t33_binoracle block "tgB": long-frame gain / EV dispatch vs the vendor tx-isp-t33.ko instructions
# (openimp #99).  The per-block update functions are hardware / shared-T32 code: CALLS, never run.
SRC=tgB.c
PROVES=''
FUNCS='
tisp_long_tgain_update     bo_tisp_long_tgain_update     v0   r:0:3 u32 u32 u32
tisp_long_ev_update        bo_tisp_long_ev_update        v0   r:0:3 u32 u32 u32 u32 u32
tisp_long_again_update     bo_tisp_long_again_update     v0
CALLS tisp_top_get_bypass:1=0,1,2,3,0x100,0x1000,0x2000,0x4000,0x800,0x20,0x40,0x8,0x80,0x200,0x10000,0x40000,0x100000,0xffffffff
CALLS tisp_dpc_l_gain_update:2
CALLS tisp_blc_tgain_update:2
CALLS tisp_lsc_tgain_update:4
CALLS tisp_dmsc_refresh:2
CALLS tisp_mdns_refresh:2
CALLS tisp_ysp_refresh:2
CALLS tisp_cdns_refresh:2
CALLS tisp_ydns_refresh:2
CALLS tisp_sdns_refresh:2
CALLS tisp_rdns_refresh:2
CALLS tisp_awb_tgain_update:4
CALLS tisp_af_tgain_update:2
CALLS tisp_awb_ev_update:4
CALLS tisp_gamma_ev_update:4
CALLS tisp_ccm_ev_update:4
CALLS tisp_rdns_ev_update:4
CALLS tisp_defog_ev_update:6
CALLS tisp_bcsh_ev_update:6
CALLS tisp_lce_ev_update:6
CALLS tisp_tmo_ev_update:6
GLOBAL tgain_old tgain_old 16 w:0:0,1 w:4:0,1 w:8:0,1 w:12:0,1
GLOBAL ev_last ev_last 32 w:0:0,1 w:4:0,1 w:8:0,1 w:12:0,1 w:16:0,1 w:20:0,1 w:24:0,1 w:28:0,1
VEC tisp_long_tgain_update 0 5 0 0
VEC tisp_long_tgain_update 0 5 1 0
VEC tisp_long_tgain_update 0 5 0 1
VEC tisp_long_tgain_update 0 5 1 1
VEC tisp_long_tgain_update 1 5 0 0
VEC tisp_long_tgain_update 1 5 1 0
VEC tisp_long_tgain_update 1 5 0 1
VEC tisp_long_tgain_update 2 5 0 0
VEC tisp_long_tgain_update 2 5 1 0
VEC tisp_long_tgain_update 3 5 0 0
VEC tisp_long_tgain_update 3 5 1 0
VEC tisp_long_ev_update 0 5 0 0 7 8
VEC tisp_long_ev_update 0 5 0 1 7 8
VEC tisp_long_ev_update 0 5 1 0 7 8
VEC tisp_long_ev_update 0 5 1 1 7 8
VEC tisp_long_ev_update 1 5 0 0 7 8
VEC tisp_long_ev_update 1 5 0 1 7 8
VEC tisp_long_ev_update 1 5 1 0 7 8
VEC tisp_long_ev_update 1 5 1 1 7 8
VEC tisp_long_ev_update 2 5 0 0 7 8
VEC tisp_long_ev_update 2 5 0 1 7 8
VEC tisp_long_ev_update 2 5 1 0 7 8
VEC tisp_long_ev_update 2 5 1 1 7 8
VEC tisp_long_ev_update 3 5 0 0 7 8
VEC tisp_long_ev_update 3 5 0 1 7 8
VEC tisp_long_ev_update 3 5 1 0 7 8
VEC tisp_long_ev_update 3 5 1 1 7 8
VEC tisp_long_tgain_update 0 0 0 0
VEC tisp_long_tgain_update 0 0 0x10000 1
VEC tisp_long_tgain_update 1 0x10000 0 0x10000
VEC tisp_long_ev_update 0 0 0 0 0 0
VEC tisp_long_ev_update 0 0x100 0x200 1 2 0x1000
VEC tisp_long_ev_update 1 0x10000 0x200 0 0 0x10000
'
MUTATIONS='
tx_isp_t33_tgB.h|	if (tgain_old[ch] == gain && !force)|	if (tgain_old[ch] == gain)
tx_isp_t33_tgB.h|	if (!(byp & 0x1))|	if (!(byp & 0x3))
tx_isp_t33_tgB.h|		o->lsc_tgain_update(ch, a1, gain, force);|		o->lsc_tgain_update(ch, gain, gain, force);
tx_isp_t33_tgB.h|	tgain_old[ch] = gain;|	tgain_old[ch] = gain + 1;
tx_isp_t33_tgB.h|	if (e[0] == ev0 && e[1] == ev1)|	if (e[0] == ev0)
tx_isp_t33_tgB.h|	if (!(byp & 0x100))|	if (!(byp & 0x300))
tx_isp_t33_tgB.h|	o->awb_ev_update(ch, arg1, ev0, ev1);|	o->awb_ev_update(ch, ev0, arg1, ev1);
tx_isp_t33_tgB.h|	e[0] = ev0;|	e[0] = ev0 + 1;
tx_isp_t33_tgB.h|	if (!(byp & 0x20))|	if (!(byp & 0x60))
tx_isp_t33_tgB.h|		o->defog_ev_update(ch, arg1, ev0, ev1, a4, a5);|		o->defog_ev_update(ch, arg1, ev1, ev0, a4, a5);
'
