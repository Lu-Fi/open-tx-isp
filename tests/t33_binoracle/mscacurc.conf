# t33_binoracle block "mscacurc": tisp_msca_t33_curve_calc with the real tisp_sin (vendor kernel tables) and the real
# 2/3/4/6-point normalisation on both sides vs the vendor tx-isp-t33.ko (openimp #99, #643): random channel sizes
# (stMscaAttr) and crop sizes give ratios 0 .. 0x6aaa; compared are the four coefficient sets in msca_info[id], the
# steps in the parameter block and every sum check message (isp_printf).
SRC=mscacurc.c
PROVES='tisp_sin tisp_msca_t33_two_point_normalized tisp_msca_t33_thr_point_normalized tisp_msca_t33_four_ponit_normalized tisp_msca_t33_six_point_normalized'
FUNCS='
CALLS isp_printf:1
GLOBAL msca_info bo_msca_info 16 q:0:384:@0=256/184=0,1/185=0/186=0,1/187=0/188=0,1/189=0 q:4:384:@0=256/184=0,1/185=0/186=0,1/187=0/188=0,1/189=0 q:8:384:@0=256/184=0,1/185=0/186=0,1/187=0/188=0,1/189=0 q:12:384:@0=256/184=0,1/185=0/186=0,1/187=0/188=0,1/189=0
GLOBAL stMscaAttr bo_msca_attr 16 q:0:80 q:4:80 q:8:80 q:12:80
tisp_msca_t33_curve_calc         bo_tisp_msca_t33_curve_calc         none r:0:3 r:0:2
'
MUTATIONS='
tx_isp_t33_mscacur.h|	if (rh > 0x6aaa)|	if (rh > 0x6000)
tx_isp_t33_mscacur.h|	m->sin(rh, 24, (short *)(inf + 0x92));|	m->sin(rh, 16, (short *)(inf + 0x92));
tx_isp_t33_r13B.h|		out[j] = (short)((v >> 10) + ((v >> 9) & 1));|		out[j] = (short)(v >> 10);
tx_isp_t33_mscacur.h|hv = v < 0 ? -(s / 2) : s / 2;|hv = v < 0 ? (s / 2) : s / 2;
tx_isp_t33_mscacur.h|			tap[t] = (v * 0x800 + hv) / s;|			tap[t] = (v * 0x801 + hv) / s;
'
