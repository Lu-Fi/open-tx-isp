# Vendor T32 module (run with T33_OEM_KO = the vendor tx-isp-t32.ko; make target t32_binoracle_bcshapi, openimp #716).
# tisp_bcsh_api_set_brightness / _contrast / _saturation / _hue: the user byte into ap, the section's API flag, the
# exposure interpolation (forced) and calc_para_refresh mode 0 on the BCSH block state, then the write request
# (driver/t32/tx_isp_t32_bcsh.h t32_bcsh_api_set_*; driver use: tx_isp_t32_ctup.c t32_ctup_bcsh_set).
SRC=t32-bcshapi.c
PROVES=''
FUNCS='
NOP __private_spin_lock_irqsave private_spin_unlock_irqrestore
GLOBAL bcsh_para bcsh_para 16 q:0:28:@0=1204:@4=24/19=0,1,1,2:@8=300:@12=112:@16=144:@20=48
tisp_bcsh_api_set_brightness   bo_tisp_bcsh_api_set_brightness   none   r:0:0 buf:1
tisp_bcsh_api_set_contrast     bo_tisp_bcsh_api_set_contrast     none   r:0:0 buf:1
tisp_bcsh_api_set_saturation   bo_tisp_bcsh_api_set_saturation   none   r:0:0 buf:1
tisp_bcsh_api_set_hue          bo_tisp_bcsh_api_set_hue          none   r:0:0 buf:1
'
MUTATIONS='
tx_isp_t32_bcsh.h|	st->sec[0x49f] = 2;|	st->sec[0x49e] = 2;
tx_isp_t32_bcsh.h|	st->ap[0] = v;|	st->ap[0] = v ^ 1;
tx_isp_t32_bcsh.h|	st->sec[0x468] = 2;|	st->sec[0x468] = 1;
tx_isp_t32_bcsh.h|	st->ap[1] = v;|	st->ap[2] = v;
tx_isp_t32_bcsh.h|	st->sec[0x462] = 2;|	st->sec[0x463] = 2;
tx_isp_t32_bcsh.h|	st->ap[3] = v;|	st->ap[3] = v + 1;
tx_isp_t32_bcsh.h|p = sec[0x466] ? 0x2e : 0x25;|p = sec[0x466] ? 0x25 : 0x2e;
tx_isp_t32_bcsh.h|(d >> 1) + 0x1000) / d : 0, 0, 0x3ff));|(d >> 1) + 0x2000) / d : 0, 0, 0x3ff));
'
