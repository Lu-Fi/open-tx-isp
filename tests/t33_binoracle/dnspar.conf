# t33_binoracle block "dnspar": func_dmsc_para_update on the DMSC block state (openimp #99, hand port step 3b):
# the vendor reads dmscInfo[0], ours gets the block (FUNCS arg info:, tools/ko_emu/t33_binoracle.py).
# The four cti_func_slope_calc x words (0x140 .. 0x146, 8-bit IQ fields) stay in 0..0x100: below 0 the vendor's
# slope returns early and func_dmsc_para_update stores its uninitialised stack words (ours keep 0).
SRC=dnspar.c
N=${N:-2000}; MUT_N=${MUT_N:-2000}	# the 0x7f / 0x1ff special cases need equal neighbouring words (edge mode)
# PROVES: the callees the compared block depends on (T33-only)
PROVES='isp_dmsc_update_value_ks func_dmsc_isp_itp_update_ks'
FUNCS='
func_dmsc_para_update  bo_dmsc_para  none info:dmscInfo:0xa88:140<257,142<257,144<257,146<257
'
MUTATIONS='
tx_isp_t33_dmsc.h|	if ((int)(v[0x272] - (u32)a) < 2) {|	if ((v[0x272] - (u32)a) < 2) {
tx_isp_t33_dmsc.h|			v[0x275] = 0xffd;|			v[0x275] = 0xffc;
tx_isp_t33_dmsc.h|	v[0x16d] = (int)v[0x23] < 1 ? 0 : 0xff;|	v[0x16d] = (int)v[0x23] < 1 ? 0 : 0xfe;
tx_isp_t33_dmsc.h|	a = (int)(v[0xcd] * 2 + v[0xce]);|	a = (int)(v[0xcd] * 3 + v[0xce]);
tx_isp_t33_dmsc.h|		v[0x274] = 0x7f;|		v[0x274] = 0x7e;
tx_isp_t33_dmsc.h|		t33_itp_ks(t33_iabs(d - c), t33_iabs(b - a), 9, 13, &v[0x279], &v[0x282]);|		t33_itp_ks(t33_iabs(d - c), t33_iabs(b - a), 8, 13, &v[0x279], &v[0x282]);
tx_isp_t33_dmsc.h|	{ 0x14b, 0x1, 0, 0 },|	{ 0x14b, 0x2, 0, 0 },
tx_isp_t33_dmsc.h|	if (!v[0x149]) {|	if (!v[0x148]) {
tx_isp_t33_blk.h|	for (s = smax; s >= 2; s--) {|	for (s = smax; s >= 3; s--) {
'
