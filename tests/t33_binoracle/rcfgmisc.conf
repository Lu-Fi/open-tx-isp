# t33_binoracle block "rcfgmisc": rcfg trigger / reset / interrupt switch vs the vendor tx-isp-t33.ko
SRC=rcfgmisc.c
PROVES=''
FUNCS='
lib_tisp_rcfg_cfg_trig          bo_lib_tisp_rcfg_cfg_trig          none r:0:3
tisp_rcfg_t33_reset_reg_cfg     bo_tisp_rcfg_t33_reset_reg_cfg     none
tisp_rcfg_t33_switch_interrupt  bo_tisp_rcfg_t33_switch_interrupt  none r:0:3
