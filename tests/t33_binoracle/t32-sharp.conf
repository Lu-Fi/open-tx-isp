# Vendor T32 module (run with T33_OEM_KO = the vendor tx-isp-t32.ko; make target t32_binoracle_sharp, openimp #711).
# tisp_set_sharpness: DMSC sharpness byte + refresh at the context gain, the 32 x 11 YSP strength bytes from
# ysp_paramsP, YSP refresh at the context gain, the 0xdce0.. words and the triggers (driver/t32/tx_isp_t32_sharp.h).
SRC=t32-sharp.c
PROVES=''
FUNCS='
CALLS tisp_reg_write:3
GLOBAL dmsc_info dmsc_info 16 q:0:20:b10=0,1,2,5,9,10,11,255:b11=0,0,0,255:b16=0,1,127,128,129,255:@0=4708:@4=426
GLOBAL ysp_info ysp_info 16 q:0:20:b10=0,1,2,5,9,10,11,255:b11=0,0,0,255:@0=3928:@4=390
GLOBAL ysp_paramsP ysp_paramsP 4 q:0:3928
GLOBAL ysp_ratio ysp_ratio 4
GLOBAL cfgMode cfgMode 1 w:0:0
GLOBAL ispcore_sd ispcore_sd 4 q:0:256:@244=73728f
VEC tisp_set_sharpness 0 0
VEC tisp_set_sharpness 0 1
VEC tisp_set_sharpness 0 127
VEC tisp_set_sharpness 0 128
VEC tisp_set_sharpness 0 129
VEC tisp_set_sharpness 0 255
VEC tisp_set_sharpness 0 0x180
tisp_set_sharpness   bo_tisp_set_sharpness   none   r:0:0 u32
'
MUTATIONS='
tx_isp_t32_sharp.h|level &= 0xff;|level &= 0x7f;
tx_isp_t32_sharp.h|n = t32_dmsc_sharpness_set(d, level, w);|n = t32_dmsc_sharpness_set(d, level ^ 1, w);
tx_isp_t32_sharp.h|n += t32_ysp_sharpness_set(y, ch, ysp_dn, ysp_ratio, level, w + n);|n += t32_ysp_sharpness_set(y, ch, ysp_dn, ysp_ratio, level ^ 1, w + n);
tx_isp_t32_sharp.h|if (y && ysp_dn)|if (y && !ysp_dn)
tx_isp_t32_ysp.h|unsigned int o = 2205 + 11 * i + j;|unsigned int o = 2206 + 11 * i + j;
tx_isp_t32_ysp.h|unsigned int o = 2205 + 11 * i + j;|unsigned int o = 2205 + 10 * i + j;
tx_isp_t32_ysp.h|if ((int)sh < 129)|if ((int)sh < 130)
tx_isp_t32_ysp.h|ctx->sec[o] = (u8)((int)(b * sh) >> 7);|ctx->sec[o] = (u8)((int)(b * sh) >> 6);
tx_isp_t32_ysp.h|(u8)(b + ((int)((255 - b) * (sh - 128)) >> 7));|(u8)(b + ((int)((254 - b) * (sh - 128)) >> 7));
tx_isp_t32_ysp.h|(u8)(b + ((int)((255 - b) * (sh - 128)) >> 7));|(u8)(b + ((int)((255 - b) * (sh - 127)) >> 7));
tx_isp_t32_ysp.h|*sharp_store = sh;|*sharp_store = sh + 1;
tx_isp_t32_dmsc.h|ctx->sharpness = sharpness & 0xff;|ctx->sharpness = sharpness & 0x7f;
tx_isp_t32_dmsc.h|t32_tp_put16(q, t32_dmsc_ratio(ctx->sharpness, t32_tp_le16(q), 600));|t32_tp_put16(q, t32_dmsc_ratio(ctx->sharpness, t32_tp_le16(q), 601));
'
