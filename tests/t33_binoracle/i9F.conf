# t33_binoracle block "i9F": tisp_awb_init, tisp_defog_init vs the vendor tx-isp-t33.ko instructions (openimp #99)
# private_kmalloc is a CALLS entry: its return values are 11 slots (0x13480 bytes each) of one zeroed arena block
# that hangs on the last word of awb_ls_wgt_lut_inter (q:1024) and is compared after the call, so every store into
# the allocated state blocks is compared.  The values cycle by case + call index; the kmalloc call indices of both
# functions are distinct modulo 11, so the blocks of one case never overlap.  The arena address is the second heap
# allocation of a case (after the 1024 byte argument buffer, the same for both functions); it is probed from
# ko_emu here (run.sh sources this file after setting KO and H).  memset / memcpy are CALLS (recorded, not run):
# the AWB state bytes 38057 / 0x10438 the vendor reads after its memset are seeded in every slot (b options).
# Not reachable: NULL returns of private_kmalloc (the vendor dereferences them in tisp_awb_init; tisp_defog_init's
# return -1 needs a NULL that the shared CALLS line cannot give to one function only).
SRC=i9F.c
PROVES=''
I9F_STEP=78976
I9F_N=$((11 * I9F_STEP))
I9F_A=$(python3 -c 'import sys
sys.path.insert(0, sys.argv[2])
from ko_emu import KoEmu
e = KoEmu(sys.argv[1], hle={}, max_insns=1000)
e.heap_reset()
e.alloc(1040, bytes(1040))
n = int(sys.argv[3])
print(e.alloc(n + 16, bytes(n + 16)))' "$KO" "$H/../../tools/ko_emu" "$I9F_N" 2>/dev/null | tail -n 1)
case "$I9F_A" in ''|*[!0-9]*) I9F_A=1073742864 ;; esac
I9F_B=$(( (I9F_A + 3) / 4 * 4 ))
I9F_KM=
I9F_FL=
I9F_K=0
while [ "$I9F_K" -lt 11 ]; do
	I9F_O=$((I9F_B - I9F_A + I9F_K * I9F_STEP))
	I9F_KM="$I9F_KM${I9F_KM:+,}$((I9F_B + I9F_K * I9F_STEP))"
	I9F_FL="$I9F_FL:b$((I9F_O + 38057))=0,0,1:b$((I9F_O + 66616))=0,0,0,1"
	I9F_K=$((I9F_K + 1))
done
# tparamsP[ch] blocks: defog section at +23496 (zoom byte 433, size 190 / 192 = 1920 x 1080, flag 594),
# AWB section at +3400 (zone start / divisor words 3184..3190: high bytes 0, divisors non-zero)
I9F_TP=':b23929=128,5:b23686=128:b23687=7:b23688=56:b23689=4:b24090=0,1:b6585=0:b6587=0:b6589=0:b6591=0:b6586=1,2,3,7,16,40,200:b6590=1,2,5,9,33,120,250'
FUNCS='
tisp_awb_init    bo_tisp_awb_init    v0 r:0:1 st:1024:12=0x04380780,0x02d00500,0x03000400,0x00500050,0x07800780
tisp_defog_init  bo_tisp_defog_init  v0 r:0:1 st:1024:12=0x04380780,0x04380780,0x04380780,0x04380780,0x04380500,0x02d00780,0x03000400,0x00ff00ff,0x05a00a00,0x04380a00,0x0f000f00
CALLS private_kmalloc:2='"$I9F_KM"' private_vmalloc:1=0,4096 memset:3 memcpy:3@1:1028 isp_printf:1 tisp_rcfg_module_register:2 tisp_awb_malloc_info:1 tisp_awb_params_refresh:2 tisp_awb_show_para_update:1 tisp_event_set_cb:2 tisp_awb_set_riscv_param:1 tisp_awb_set_hardware_param:1 tisp_awb_set_gain:1 system_irq_func_set:2 tisp_reg_write_t33:4 defog_count_weight35abc:4 tisp_defog_write_reg_para1:1 tisp_defog_interp_trans_k:4 tisp_defog_update_reg_para2:1 tisp_defog_write_reg_para2:1 tisp_defog_write_reg_para3:1
GLOBAL awb_ls_wgt_lut_inter o_awb_ls_wgt_lut_inter 1028 q:1024:'"$I9F_N"':z'"$I9F_FL"'
GLOBAL awbInfo o_awbInfo 16
GLOBAL pst_awb_ct_detect o_pst_awb_ct_detect 16
GLOBAL tparamsP o_tparamsP 16 q:0:24400'"$I9F_TP"' q:4:24400'"$I9F_TP"'
GLOBAL riscvEnable o_riscvEnable 4 w:0:0x01010101,0,0x02020202
GLOBAL tispAwbgRefresh o_tispAwbgRefresh 1
GLOBAL tispAwbRefresh o_tispAwbRefresh 1
GLOBAL defog_weight_cal_max_size o_defog_weight_cal_max_size 16
