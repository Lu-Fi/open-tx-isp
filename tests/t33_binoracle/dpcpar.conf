# t33_binoracle block "dpcpar": DPC / CTR / CAC parameter updates on the vendor dpcInfo vs the vendor tx-isp-t33.ko
# (openimp #99 group 13c).  dpcInfo[ch]: the 0x2b0-byte word array, word 0xaa (byte 680) the 604-byte IQ section;
# word 10 (the correction level) 0..5 so every level branch of func_dpc_para_update runs.
SRC=dpcpar.c
PROVES=''
FUNCS='
tisp_dpc_bin_para_update   bo_tisp_dpc_bin_para_update   none r:0:3
func_dpc_para_update       bo_func_dpc_para_update       none r:0:3
func_ctr_para_update       bo_func_ctr_para_update       none r:0:3
func_cac_para_update       bo_func_cac_para_update       none r:0:3
GLOBAL dpcInfo dpcInfo 16 q:0:688:b40=0,1,2,3,4,5,9:b41=0,0,0,1:b42=0:b43=0:@680=604 q:4:688:b40=0,1,2,3,4,5,9:b41=0,0,0,1:b42=0:b43=0:@680=604 q:8:688:b40=0,1,2,3,4,5,9:b41=0,0,0,1:b42=0:b43=0:@680=604 q:12:688:b40=0,1,2,3,4,5,9:b41=0,0,0,1:b42=0:b43=0:@680=604
'
MUTATIONS='
tx_isp_t33_dpcpar.h|		v[k] = s[4 + k];|		v[k] = s[5 + k];
tx_isp_t33_dpcpar.h|		v[0xb + k] = s[0x19 + k];|		v[0xb + k] = s[0x18 + k];
tx_isp_t33_dpcpar.h|	v[0x2a] = s[0x1f2];|	v[0x2b] = s[0x1f2];
tx_isp_t33_dpcpar.h|(u32)(int)(s16)(s[0x244 + 2 * k]|(u32)(u16)(s[0x244 + 2 * k]
tx_isp_t33_dpcpar.h|	v[0x45] = s[0x256]|	v[0x45] = s[0x257]
tx_isp_t33_dpcpar.h|{ 0x89, 0x27 },|{ 0x89, 0x26 },
tx_isp_t33_dpcpar.h|	v[0x6b] = v[0x12] - v[0x14];|	v[0x6b] = v[0x12] + v[0x14];
tx_isp_t33_dpcpar.h|	v[0x53] = lvl != 0 && lvl != 1 && lvl != 2;|	v[0x53] = lvl != 0 && lvl != 1;
tx_isp_t33_dpcpar.h|	v[0x5f] = v[0x5a];|	v[0x5f] = v[0x54];
tx_isp_t33_dpcpar.h|	v[0x8b] = 0x200;|	v[0x8b] = 0x100;
tx_isp_t33_dpcpar.h|	for (k = 0; k < 18; k++)|	for (k = 0; k < 17; k++)
tx_isp_t33_dpcpar.h|		v[0x9e + k] = v[0x3a + k];|		v[0x9e + k] = v[0x3b + k];
'
