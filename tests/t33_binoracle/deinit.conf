# t33_binoracle block "deinit": tisp_all_reset, tisp_blc_deinit, tisp_ldc_t33_deinit, tisp_msca_t33_deinit,
# tisp_normal_ae_deinit, tisp_dma_deinit vs the vendor tx-isp-t33.ko (openimp #99).  The per-channel pointer
# arrays are random (0 or not), channels 0..3 and 0x100..0x103 (the u8 mask; larger channels index past the
# vendor arrays); the register reads cycle through 0 / 1 / other values so both polls end early,
# late (timeouts: block deinitto); the list release returns 0 or an error; all calls are recorded (CALLS).
SRC=deinit.c
N=${N:-600}
PROVES=''
FUNCS='
tisp_all_reset         bo_all_reset v0
tisp_blc_deinit        bo_blc       none r:0:3
tisp_blc_deinit        bo_blc       none r:0x100:0x103
tisp_ldc_t33_deinit    bo_ldc       v0   r:0:7
tisp_ldc_t33_deinit    bo_ldc       v0   r:0x100:0x107
tisp_msca_t33_deinit   bo_msca      v0   r:0:3
tisp_normal_ae_deinit  bo_ae        none r:0:3
tisp_normal_ae_deinit  bo_ae        none r:0x100:0x103
tisp_dma_deinit        bo_dma       none
CALLS system_reg_read:1=1,0,1,1,0,0,0,7,1,0x10,2,1 system_reg_write:2 private_vfree:1 private_kfree:1
CALLS tisp_rcfg_module_release:2=0,0xffffffff,0,0xfffffff4,1 private_kthread_stop:1
CALLS isp_printf:4@1:20@2:14=0,5 printk:4@0:22@1:15
GLOBAL blc_para o_blc_para 16 w:0:0,0x80a00000 w:4:0,0x80a00010
GLOBAL stLDCAttr o_ldc_attr 16 w:0:0,0x80b00000 w:8:0,0x80b00008
GLOBAL stMscaAttr o_msca_attr 16 w:0:0,0x80c00000 w:12:0,1
GLOBAL msca_info o_msca_info 16 w:0:0,0x80d00000 w:4:0,9
GLOBAL stAeInfo o_ae_info 16
GLOBAL fliker_info o_fliker_info 16
GLOBAL fliker_para o_fliker_para 16
GLOBAL g_wdmaVinum o_wdma_vinum 1
GLOBAL wdma_thread o_wdma_thread 4
'
MUTATIONS='
tx_isp_t33_deinit.h|#define T33_RST_STATE		0x0U|#define T33_RST_STATE		0x24U
tx_isp_t33_deinit.h|	for (n = T33_RST_POLLS; !d->rd(T33_RST_STATE);)|	for (n = T33_RST_POLLS; d->rd(T33_RST_STATE) & 0xf;)
tx_isp_t33_deinit.h|	return d->log(0, 304);|	return d->log(1, 304);
tx_isp_t33_deinit.h|	d->wr(T33_RST_REQ, 1);|	d->wr(T33_RST_REQ, 3);
tx_isp_t33_deinit.h|#define T33_LDC_INT_MASK	0x27088U|#define T33_LDC_INT_MASK	0x27084U
tx_isp_t33_deinit.h|#define T33_DEIN_LIST_BLC	4|#define T33_DEIN_LIST_BLC	5
tx_isp_t33_deinit.h|#define T33_DEIN_LIST_MSCA	23|#define T33_DEIN_LIST_MSCA	22
tx_isp_t33_deinit.h|#define T33_DEIN_LIST_LDC	25|#define T33_DEIN_LIST_LDC	24
tx_isp_t33_deinit.h|	if (ch < 4 && d->ldc_attr[ch]) {|	if (ch < 3 && d->ldc_attr[ch]) {
tx_isp_t33_deinit.h|		d->err(0, r);|		d->err(1, r);
tx_isp_t33_deinit.h|	r = d->release(ch & 0xff, T33_DEIN_LIST_MSCA);|	r = d->release(ch & 1, T33_DEIN_LIST_MSCA);
tx_isp_t33_deinit.h|		d->msca_info[ch] = 0;|		d->msca_info[ch] = 1;
tx_isp_t33_deinit.h|	d->fliker_para[ch] = 0;|	d->fliker_info[ch] = 0;
tx_isp_t33_deinit.h|	*d->wdma_vinum = 0xff;|	*d->wdma_vinum = 0;
tx_isp_t33_deinit.h|	return 0;|	return r;
'
