# t33_binoracle block "ctup": tisp_ct_update, the AWB CT fan-out with its top bypass gates (openimp #507)
# (@1:0: the callees get $a1 left over from tisp_top_get_bypass, which they do not read: not compared)
SRC=ctup.c
PROVES='tisp_ct_update'
FUNCS='
tisp_ct_update            bo_tisp_ct_update            v0   r:0:1 u32 r:0:2 r:0:2
CALLS tisp_top_get_bypass:1=0,0x80,0x8,0x4000,0x8000,0x00e4c098,0xffff7f77,0xffffffff tisp_ccm_ct_update:4@1:0 tisp_lsc_ct_update:4@1:0 tisp_bcsh_ct_update:4@1:0 tisp_clm_ct_update:4@1:0
GLOBAL ct_last ct_last 16 w:0:0,1,2 w:4:0,1,2 w:8:0,1,2 w:12:0,1,2
'
MUTATIONS='
tx_isp_t33_ctup.h|	if (last[0] == ct && last[1] == ct2)|	if (last[0] == ct || last[1] == ct2)
tx_isp_t33_ctup.h|	byp = T33_CTUP_BYPASS(ch & 0xff);|	byp = T33_CTUP_BYPASS(ch & 0xfe);
tx_isp_t33_ctup.h|	if (!(byp & 0x80))|	if (!(byp & 0x40))
tx_isp_t33_ctup.h|	if (!(byp & 0x8))|	if (!(byp & 0x10))
tx_isp_t33_ctup.h|	if (!(byp & 0x4000))|	if (!(byp & 0x2000))
tx_isp_t33_ctup.h|	if (!(byp & 0x8000))|	if (!(byp & 0x4000))
tx_isp_t33_ctup.h|		T33_CTUP_CLM(ch, x, ct, ct2);|		T33_CTUP_CLM(ch, x, ct2, ct);
tx_isp_t33_ctup.h|	last[1] = ct2;|	last[1] = ct;
tx_isp_t33_ctup.h|	last[0] = ct;|	last[0] = ct2;
'
