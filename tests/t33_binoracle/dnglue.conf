# t33_binoracle block "dnglue": CSCCR / MDNS day-night glue (openimp #99, #507): lib_tisp_set_csccr,
# tisp_csccr_set_day / set_night, tisp_mdns_dn_params_api / api2.  Every list-slot write (tisp_reg_write_t33) is
# recorded (CALLS) and compared in order; the cfg modes take both values (list slot / direct register).
SRC=dnglue.c
PROVES=''
FUNCS='
CALLS tisp_reg_write_t33:4 isp_printf:1
GLOBAL csccrCfgMode o_csccrCfgMode 1 w:0:0,1
GLOBAL tispCsccrRefresh o_tispCsccrRefresh 1
GLOBAL mdnsCfgMode o_mdnsCfgMode 1 w:0:0,1
GLOBAL tispMdnsRefresh o_tispMdnsRefresh 1
GLOBAL uvLimitFlag o_uvLimitFlag 4
GLOBAL ispInitFinish o_ispInitFinish 4 w:0:0,0x1010101,0x2020202,0x01000100,0x00010001
GLOBAL start_night o_start_night 4
GLOBAL stIspInitPar o_stIspInitPar 4032
GLOBAL frameCount o_frameCount 16 w:0:0,0xffffff,0xfffffe w:4:0,0xffffff w:8:0xffffff,5 w:12:0xfffffe,0
GLOBAL curFrame o_curFrame 16
GLOBAL curFrame2 o_curFrame2 16
tisp_csccr_set_day          bo_tisp_csccr_set_day          none r:0:300
tisp_csccr_set_night        bo_tisp_csccr_set_night        none r:0:300
tisp_mdns_dn_params_api     bo_tisp_mdns_dn_params_api     v0   info:mdnsInfo:0x1418
tisp_mdns_dn_params_api2    bo_tisp_mdns_dn_params_api2    v0   info:mdnsInfo:0x1418
lib_tisp_set_csccr          bo_lib_tisp_set_csccr          v0   r:0:3 u32
VEC lib_tisp_set_csccr 0 0
VEC lib_tisp_set_csccr 0 1
VEC lib_tisp_set_csccr 1 0x100
VEC lib_tisp_set_csccr 2 0x101
VEC lib_tisp_set_csccr 3 2
'
MUTATIONS='
tx_isp_t33_dnglue.h|*s->csccr_cfg ? 7 : 0x14054|*s->csccr_cfg ? 7 : 0x14050
tx_isp_t33_dnglue.h|*s->csccr_cfg ? 1 : 0x14010, 3|*s->csccr_cfg ? 1 : 0x14010, 2
tx_isp_t33_dnglue.h|	*s->csccr_refresh = 1;|	*s->csccr_refresh = 2;
tx_isp_t33_dnglue.h|	t33_csccr_uv(s, ch, 0x7f0180);|	t33_csccr_uv(s, ch, 0x7f0181);
tx_isp_t33_dnglue.h|? 0xb8 : 0xd1cc,|? 0xb9 : 0xd1cc,
tx_isp_t33_dnglue.h|(info[0x1410] << 8)|(info[0x1411] << 8)
tx_isp_t33_dnglue.h|(info[0x1414] << 16)|(info[0x1414] << 15)
tx_isp_t33_dnglue.h|	s->uv_limit[ch] = 1;|	s->uv_limit[ch] = 2;
tx_isp_t33_dnglue.h|0xd1cc, info[0x140c]);|0xd1cc, info[0x140d]);
tx_isp_t33_dnglue.h|	s->uv_limit[ch] = 0;|	s->uv_limit[ch] = 1;
tx_isp_t33_dnglue.h|	if (s->init_finish[ch] == 1) {|	if (s->init_finish[ch] != 0) {
tx_isp_t33_dnglue.h|			s->cur[ch] = (s->cnt[ch] + 1) & 0xffffff;|			s->cur[ch] = (s->cnt[ch] + 1) & 0xfffffff;
tx_isp_t33_dnglue.h|			s->cur2[ch] = (s->cnt[ch] + 2) & 0xffffff;|			s->cur2[ch] = (s->cnt[ch] + 1) & 0xffffff;
tx_isp_t33_dnglue.h|			s->initpar[ch * T33_DN_CH_SIZE + T33_DN_DAY_FLAG] = 1;|			s->initpar[ch * T33_DN_CH_SIZE + T33_DN_DAY_FLAG] = 2;
tx_isp_t33_dnglue.h|		return -1;|		return -2;
tx_isp_t33_dnglue.h|	mode &= 0xff;|	mode &= 0x1ff;
tx_isp_t33_dnglue.h|		s->start_night[ch] = (u8)mode;|		s->start_night[ch] = (u8)mode + 1;
'
