# t33_binoracle block "afalgo": the T33 AF per-frame algorithm (tisp_af_alogrithm) vs the vendor tx-isp-t33.ko (openimp #437)
# af_info[0]: the 0x4f0-byte block (metric select byte 0x403 = 0..4) whose +0x4e8 points at the AF section (rows 0x52 /
# columns 0x56 = 1..15, fixpoint bits 0x1e8 = 4..16); af_buf_info[0] +4 points at the 0x6000-byte statistics buffer
# (each bank's record tag u16 +0 / +0x1520 equal or not); system_reg_read(0x1811c) picks the bank.
SRC=afalgo.c
PROVES=''
FUNCS='
tisp_af_alogrithm          bo_tisp_af_alogrithm          none r:0:0
CALLS system_reg_read:1=0,1,2,3,7
GLOBAL af_info af_info 16 q:0:1264:b1027=0,1,2,3,4:b1025=0:@1256=800/82=1,2,7,15/83=0/86=1,3,9,15/87=0/488=4,10,16/489=0
GLOBAL af_buf_info af_buf_info 16 q:0:8:@4=24576/0=0,1/1=0/5408=0/5409=0/6144=0,1/6145=0/11552=0/11553=0/12288=0,1/12289=0/17696=0/17697=0/18432=0,1/18433=0/23840=0/23841=0
GLOBAL fv_old fv_old 16 w:0:0,1,77777
'
MUTATIONS='
tx_isp_t33_afalgo.h|sa += w * t33_afa_rd32(blk + 16);|sa += w * t33_afa_rd32(blk + 20);
tx_isp_t33_afalgo.h|sc += w * t33_afa_rd32(blk + 8);|sc += w * t33_afa_rd32(blk + 4);
tx_isp_t33_afalgo.h|row += rows * 24;|row += cols * 24;
tx_isp_t33_afalgo.h|wr += 15;|wr += 16;
tx_isp_t33_afalgo.h|stat + T33_AFA_TAG_END)|stat + T33_AFA_TAG_END + 2)
tx_isp_t33_afalgo.h|sc = t33_afa_mult2(fb, sc << sh, one - c5);|sc = t33_afa_mult2(fb, sc << sh, c5);
tx_isp_t33_afalgo.h|m = (h1 + h2) >> sh;|m = (h1 + h2) >> (sh + 1);
tx_isp_t33_afalgo.h|((sa + sc) >> 3)|((sa + sc) >> 2)
tx_isp_t33_afalgo.h|t33_afa_shift(sec + 4, sec + 0x40);|t33_afa_shift(sec + 4, sec + 0x3c);
tx_isp_t33_afalgo.h|t33_afa_wr32(sec + 0x4c, v2 * area);|t33_afa_wr32(sec + 0x4c, v1 * area);
tx_isp_t33_afalgo.h|ring_v = t33_afa_div(0x10, d, *fv_old);|ring_v = t33_afa_div(0x0f, d, *fv_old);
tx_isp_t33_afalgo.h|if (c_sel > 3) {|if (c_sel > 2) {
tx_isp_t33_afalgo.h|c_sel == 1 ? 0x44 :|c_sel == 1 ? 0x48 :
tx_isp_t33_afalgo.h|t33_afa_wr32(info + 0x3f8, sel_v);|t33_afa_wr32(info + 0x3f4, sel_v);
tx_isp_t33_afalgo.h|		*fv_old = 1;|		*fv_old = 2;
tx_isp_t33_afalgo.h|sel_v = c_sel == 0 ? ring_v << (ring_sh & 31)|sel_v = c_sel == 0 ? ring_v << (ring_sh & 15)
'
