# t33_binoracle block "top": TOP bypass / register-write helpers vs the vendor tx-isp-t33.ko (openimp #99)
SRC=top.c
PROVES=''
FUNCS='
tisp_top_get_bypass       bo_tisp_top_get_bypass       v0   r:0:255
tisp_top_set_bypass       bo_tisp_top_set_bypass       v0   r:0:0 u32
tisp_top_reg_write        bo_tisp_top_reg_write        v0   r:0:255
CALLS tisp_reg_read_t33:3=0,0x12345678,0xffffffff tisp_rcfg_get_dma_state:1=0,1 tisp_top_reg_cfg:1
GLOBAL ipcCfgMode ipcCfgMode 1
GLOBAL tispTopRefresh tispTopRefresh 1
GLOBAL stTopPar stTopPar 1024 p:0:44
'
MUTATIONS='
tx_isp_t33_top.h|        r = 2;|        r = 3;
tx_isp_t33_top.h|        ((u8 *)p)[12 + k] = (bits >> k) & 1;|        ((u8 *)p)[12 + k] = (bits >> (k ^ 1)) & 1;
tx_isp_t33_top.h|    u32 sel = ipcCfgMode ? 1 : 64;|    u32 sel = ipcCfgMode ? 64 : 1;
tx_isp_t33_top.h|    return tisp_reg_read_t33(id & 0xff, 33, sel);|    return tisp_reg_read_t33(id & 0x7f, 33, sel);
tx_isp_t33_top.h|    return tisp_reg_read_t33(id & 0xff, 33, sel);|    return tisp_reg_read_t33(id & 0xff, 32, sel);
tx_isp_t33_top.h|    if (!tisp_rcfg_get_dma_state(33)) {|    if (tisp_rcfg_get_dma_state(33)) {
tx_isp_t33_top.h|        tisp_top_reg_cfg(id & 0xff);|        tisp_top_reg_cfg(id & 0xfe);
tx_isp_t33_top.h|        r = 1;|        r = 0;
tx_isp_t33_top.h|    tispTopRefresh = (u8)r;|    tispTopRefresh = (u8)(r + 1);
tx_isp_t33_top.h|    return r;|    return r + 1;
'
