# t33_binoracle block "mscanorm": tisp_msca_t33_two_point_normalized / _thr_point_ / _four_ponit_ /
# _six_point_normalized (hand port, real bodies) vs the vendor tx-isp-t33.ko (openimp #99, #643): random taps with a
# positive sum per phase (s16s 1..2047 and ascending kn16; real tisp_sin kernel sets in block mscacurc), n <= 8 (the
# vendor's stack tables hold 3n + 1 entries); the sum check message as CALLS isp_printf.  Not covered: phases whose tap
# sum is <= 0 (no kernel sample set has one): the vendor's rounding error can then exceed the tap count and its fix-up
# loop reads past the tap order tables on its stack.
SRC=mscanorm.c
PROVES=''
FUNCS='
CALLS isp_printf:1
tisp_msca_t33_two_point_normalized   bo_tisp_msca_t33_two_point_normalized   none r:0:8 u32 s16s:32:1:2047
tisp_msca_t33_thr_point_normalized   bo_tisp_msca_t33_thr_point_normalized   none r:0:8 u32 s16s:32:1:2047
tisp_msca_t33_four_ponit_normalized  bo_tisp_msca_t33_four_ponit_normalized  none r:0:8 u32 s16s:32:1:2047
tisp_msca_t33_six_point_normalized   bo_tisp_msca_t33_six_point_normalized   none r:0:8 u32 s16s:32:1:2047
tisp_msca_t33_two_point_normalized   bo_tisp_msca_t33_two_point_normalized   none r:8:8 u32 kn16:32:2048
tisp_msca_t33_thr_point_normalized   bo_tisp_msca_t33_thr_point_normalized   none r:8:8 u32 kn16:32:2048
tisp_msca_t33_four_ponit_normalized  bo_tisp_msca_t33_four_ponit_normalized  none r:8:8 u32 kn16:32:2048
tisp_msca_t33_six_point_normalized   bo_tisp_msca_t33_six_point_normalized   none r:8:8 u32 kn16:32:2048
'
MUTATIONS='
tx_isp_t33_mscacur.h|			tap[t] = (v * 0x800 + hv) / s;|			tap[t] = (v * 0x800 - hv) / s;
tx_isp_t33_mscacur.h|			s += c[k[t]];|			s += c[k[t]] + 1;
tx_isp_t33_mscacur.h|				tap[add[t]]++;|				tap[sub[t]]++;
tx_isp_t33_mscacur.h|				tap[sub[t]]--;|				tap[add[t]]--;
tx_isp_t33_mscacur.h|		err -= 0x800;|		err -= 0x7ff;
tx_isp_t33_mscacur.h|if (((p != 0 && p != (int)n)|if (((p != 1 && p != (int)n)
tx_isp_t33_mscacur.h|s != 0x800)|s != 0x801)
tx_isp_t33_mscacur.h|	for (t = 0; t <= out; t++)|	for (t = 0; t < out; t++)
tx_isp_t33_mscacur.h|int pos[2] = { 0, (int)n };|int pos[2] = { 0, (int)n - 1 };
tx_isp_t33_mscacur.h|add[3] = { 1, 0, 2 }, sub[3] = { 2, 0, 1 };|add[3] = { 1, 0, 2 }, sub[3] = { 0, 2, 1 };
tx_isp_t33_mscacur.h|sub[4] = { 3, 0, 2, 1 };|sub[4] = { 0, 3, 2, 1 };
tx_isp_t33_mscacur.h|add[6] = { 2, 3, 1, 4, 0, 5 }|add[6] = { 3, 2, 1, 4, 0, 5 }
tx_isp_t33_mscacur.h|u32 h = (n * 3) >> 1;|u32 h = (n * 3 + 1) >> 1;
tx_isp_t33_mscacur.h|(int)((n * 6) >> 1), "tisp_msca_t33_six|(int)((n * 6) >> 1) - 1, "tisp_msca_t33_six
tx_isp_t33_mscacur.h|int pos[4] = { -(int)n, 0, (int)n, (int)(n << 1) };|int pos[4] = { -(int)n, 0, (int)n + 1, (int)(n << 1) };
'
