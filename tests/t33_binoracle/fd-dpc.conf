# t33_binoracle block "fd-dpc": DPC frame-done handler vs the vendor tx-isp-t33.ko instructions (openimp #99)
SRC=fd-dpc.c
PROVES='tisp_dpc_t33_frame_done_interrupt'
FUNCS='
tisp_dpc_t33_frame_done_interrupt bo_tisp_dpc_t33_frame_done_interrupt v0 r:0:3
GLOBAL stIspInitPar stIspInitPar 4032 w:904:1,1,1,0,2
