tx_isp_t33_swysp.h|{ 2688, 1048, 0 }|{ 2688, 1056, 0 }
tx_isp_t33_swysp.h|(w24 << 24)|(w24 << 16)
tx_isp_t33_swysp.h|v + 1068 / 4|v + 1072 / 4
