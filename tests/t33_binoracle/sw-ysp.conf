PROVES='tisp_ysp_switch_para'
FUNCS='
tisp_ysp_switch_para   bo_tisp_ysp_switch_para   v0   r:0:0 info:yspInfo:2200:220<0xc0000
CALLS memcpy:3 tisp_ysp_bin_data_refresh:1 tisp_ysp_reg_data_refresh:1 tisp_rcfg_get_dma_state:1=0,0,0,1 tisp_reg_write_t33:4 tisp_mdns_decode_reg_write:2
GLOBAL tparamsP tparamsP 16 p:0:39800
GLOBAL ysp_paramsP ysp_paramsP 16 p:0:8
GLOBAL yspCfgMode yspCfgMode 1 w:0:0,1
