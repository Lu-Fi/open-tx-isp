# t33_binoracle block "lscv": LSC gain interpolation and frame done on the vendor lsc_para vs the vendor tx-isp-t33.ko
# (openimp #99 group 13b).  lsc_para[0]: 0xc4-byte info (byte 0x18 the pending-rewrite flag), word 0 the section
# (0x98 B, word 1 = mode 0..3), word 1 the 0x20-byte parameters, word 2 the 0x34-byte mesh info.
SRC=lscv.c
PROVES=''
FUNCS='
tisp_lsc_interp_by_tgain   bo_tisp_lsc_interp_by_tgain   v0   r:0:0 u32
tisp_lsc_irq_frame_done    bo_tisp_lsc_irq_frame_done    v0   r:0:0
CALLS tisp_rcfg_module_cfg_trig:2 tisp_lsc_write_reg:2
GLOBAL lsc_para lsc_para 16 q:0:196:b24=0,1:@0=152/4=0,1,2,3,4/5=0/6=0/7=0:@4=32:@8=52
GLOBAL lsc_count lsc_count 16
GLOBAL tispLscRefresh tispLscRefresh 1 w:0:0,1,2,3
GLOBAL stIspInitPar stIspInitPar 4096 w:904:0,1,2
VEC tisp_lsc_interp_by_tgain 0 0x10000
VEC tisp_lsc_interp_by_tgain 0 0xffffffff
VEC tisp_lsc_interp_by_tgain 0 0
'
MUTATIONS='
tx_isp_t33_lscmisc.h|		mi[16] = t32_tp_intp_u8(gain >> 16, gain & 0xffff, s + 0x85);|		mi[16] = t32_tp_intp_u8(gain >> 16, gain & 0xffff, s + 0x84);
tx_isp_t33_lscmisc.h|		mi[18] = t32_tp_intp_u8(gain >> 16, gain & 0xffff, s + 0x48);|		mi[18] = t32_tp_intp_u8(gain >> 16, gain & 0xffff, s + 0x49);
tx_isp_t33_lscmisc.h|	} else if (mode == 2) {|	} else if (mode == 3) {
tx_isp_t33_lscmisc.h|		mi[16] = s[0x90];|		mi[16] = s[0x91];
tx_isp_t33_lscmisc.h|	((u32 *)(unsigned long)v[1])[5] = gain;|	((u32 *)(unsigned long)v[1])[4] = gain;
tx_isp_t33_lscmisc.h|	count[ch] = (count[ch] + 1) & 0xffff;|	count[ch] = (count[ch] + 1) & 0xfffff;
tx_isp_t33_lscmisc.h|	if (v[0x18]) {|	if (v[0x19]) {
tx_isp_t33_lscmisc.h|			trig(ch & 0xff, 6);|			trig(ch & 0xff, 7);
tx_isp_t33_lscmisc.h|		if (*refresh == 1) {|		if (*refresh == 2) {
tx_isp_t33_lscmisc.h|	if (t33_le32(initpar + 904) == 1) {|	if (t33_le32(initpar + 904) == 2) {
'
