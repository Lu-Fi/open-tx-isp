# Vendor T32 module (run with T33_OEM_KO = the vendor tx-isp-t32.ko; make target t32_binoracle_topipc, openimp #759).
# tisp_top_ipc_get_mem_size ((W * raw * 3 + 1) / 2 into stMemInfo +52) and tisp_top_ipc_set_mem_cfg (0x1094 / 0x1098 /
# 0x10c4 / 0x10c8, 0x10bc / 0x10c0 for a size below 8 KiB) vs driver/t32/tx_isp_t32_front.h.
SRC=t32-topipc.c
PROVES=''
FUNCS='
CALLS system_reg_write:2
GLOBAL stMemInfo bo_mem 76 w:52:0,1,8191,8192,8193,0x7fffffff,0x80000000,0xffffffff,0x5f4000
VEC tisp_top_ipc_get_mem_size 2560 0
VEC tisp_top_ipc_get_mem_size 2560 2160
VEC tisp_top_ipc_get_mem_size 0xffff 0xffff
VEC tisp_top_ipc_get_mem_size 0x1a00 0x1a00
tisp_top_ipc_get_mem_size   bo_tisp_top_ipc_get_mem_size   v0 u32 u32
VEC tisp_top_ipc_set_mem_cfg 0
VEC tisp_top_ipc_set_mem_cfg 0x4800000
tisp_top_ipc_set_mem_cfg    bo_tisp_top_ipc_set_mem_cfg    none u32
'
MUTATIONS='
tx_isp_t32_front.h|	v = v * 3 + 1;|	v = v * 3 + 2;
tx_isp_t32_front.h|	v = (u32)((int)v / 2);|	v = v / 2;
tx_isp_t32_front.h|	u32 v = (width & 0xffff) * (height & 0xffff);|	u32 v = (width & 0xffff) * (height & 0x7fff);
tx_isp_t32_front.h|	u32 v = cfg[13] >> 13;|	u32 v = cfg[13] >> 12;
tx_isp_t32_front.h|	T32_FW(w, n, 4292, (cfg[13] << 1) / 9);|	T32_FW(w, n, 4292, (cfg[13] << 1) / 8);
tx_isp_t32_front.h|	T32_FW(w, n, 4244, width);|	T32_FW(w, n, 4244, width + 4);
tx_isp_t32_front.h|	T32_FW(w, n, 4288, 0);|	T32_FW(w, n, 4288, 1);
tx_isp_t32_front.h|	cfg[9] = width;|	cfg[9] = width + 1;
'
