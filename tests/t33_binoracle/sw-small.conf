# t33_binoracle block "sw-small": SDNS / YDNS / DPC day-night IQ-bin switch (openimp #99)
# The table interpolations (tisp_simple_intp_uint8_t / _uint16_t) are recorded calls: their (signed index, fraction,
# table address) arguments are compared, their returns cycle; so the section pointers need not be dereferenced.
SRC=sw-small.c
PROVES=''
FUNCS='
tisp_sdns_switch_para bo_tisp_sdns_switch_para v0   r:0:3
tisp_ydns_switch_para bo_tisp_ydns_switch_para none r:0:3
tisp_dpc_switch_para  bo_tisp_dpc_switch_para  none r:0:3
CALLS tisp_reg_write_t33:4 tisp_rcfg_get_dma_state:1=0,1 tisp_simple_intp_uint8_t:3=0x1ff,0x80,0x10002,0xfffffff7 tisp_simple_intp_uint16_t:3=0x1234,0xfffe,0x7,0x80000001 tisp_sdns_other_params_transform:1 func_sdns_para_update:1 func_ydns_bin_para_update:1 func_ydns_para_update:1 tisp_dpc_bin_para_update:1 func_dpc_para_update:1 func_ctr_para_update:1 func_cac_para_update:1
GLOBAL sdnsInfo sdnsInfo 16 p:0:160 p:4:160 p:8:160 p:12:160
GLOBAL ydnsInfo ydnsInfo 16 p:0:128 p:4:128 p:8:128 p:12:128
GLOBAL dpcInfo dpcInfo 16 p:0:704 p:4:704 p:8:704 p:12:704
GLOBAL tparamsP tparamsP 16
GLOBAL sdnsCfgMode sdnsCfgMode 1 w:0:0,1
GLOBAL ydnsCfgMode ydnsCfgMode 1 w:0:0,1
GLOBAL dpcCfgMode dpcCfgMode 1 w:0:0,1
GLOBAL tispSdnsRefresh tispSdnsRefresh 1
GLOBAL tispYdnsRefresh tispYdnsRefresh 1
GLOBAL tispDpcRefresh tispDpcRefresh 1
'
MUTATIONS='
tx_isp_t33_swsmall.h|tparamsP[ch] + 0x9b20;|tparamsP[ch] + 0x9b24;
tx_isp_t33_swsmall.h|tparamsP[c] + 0x88ac;|tparamsP[c] + 0x88b0;
tx_isp_t33_swsmall.h|	i = (int)inf[37] >> 16;|	i = inf[37] >> 16;
tx_isp_t33_swsmall.h|	inf[3] = T33_I8(27);|	inf[3] = T33_I8(28);
tx_isp_t33_swsmall.h|	inf[47] = T33_I16(526);|	inf[47] = T33_I16(527);
tx_isp_t33_swsmall.h|	inf[22] = T33_I8(120);|	inf[22] = T33_I16(120);
tx_isp_t33_swsmall.h|t33_sw_pair(inf[147], inf[148], 0xfff)|t33_sw_pair(inf[147], inf[148], 0x7ff)
tx_isp_t33_swsmall.h|t33_sw_slot(m, 37, 0x2064)|t33_sw_slot(m, 38, 0x2064)
tx_isp_t33_swsmall.h|(inf[100] & 1) << 28|(inf[100] & 1) << 27
tx_isp_t33_swsmall.h|tisp_rcfg_get_dma_state(2) ? 2 : 1;|tisp_rcfg_get_dma_state(2) ? 1 : 1;
tx_isp_t33_swsmall.h|		tispSdnsRefresh = 2;|		tispSdnsRefresh = 1;
tx_isp_t33_swsmall.h|		tispYdnsRefresh = 2;|		tispYdnsRefresh = 1;
tx_isp_t33_swsmall.h|	for (k = 0; k < 3; k++)|	for (k = 0; k < 2; k++)
tx_isp_t33_swsmall.h|t33_sw_slot(sdnsCfgMode, 8, 0x13034), inf[31] & 0x1f|t33_sw_slot(sdnsCfgMode, 8, 0x13034), inf[31] & 0x0f
tx_isp_t33_swsmall.h|t33_sw_slot(ydnsCfgMode, 6, 0xe05c)|t33_sw_slot(ydnsCfgMode, 6, 0xe058)
tx_isp_t33_swsmall.h|(inf[14] & 3) << 8|(inf[14] & 1) << 8
'
