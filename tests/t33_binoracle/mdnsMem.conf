# t33_binoracle block "mdnsMem": tisp_mdns_t33_set_mem_cfg vs the vendor tx-isp-t33.ko instructions (openimp #99)
# chn is fixed to 0 (mdnsInfo / riscvEnable / stRiscvPara are only shaped for channel 0).
SRC=mdnsMem.c
PROVES=''
FUNCS='
tisp_mdns_t33_set_mem_cfg  bo_tisp_mdns_t33_set_mem_cfg  none r:0:0 r:0:3
CALLS tisp_reg_write_t33:4 system_reg_write:2 tisp_rcfg_module_cfg_trig:2 printk:0
GLOBAL mdnsCfgMode mdnsCfgMode 1 w:0:0,1
GLOBAL riscvEnable riscvEnable 4 w:0:0x01010101,0x01,0
GLOBAL mdnsInfo mdnsInfo 16 q:0:8800:b8760=0,1:b8761=0:b8762=0:b8763=0
GLOBAL stIspInitPar stIspInitPar 4032 w:12:0x04380780,0x02d00500,0x01e00280,0x00010001,0x00080007,0x0007001f,0x2000ffff,0x1234abcd,0x00200020,0x000a0011 w:904:0,1,2
GLOBAL stMemInfo stMemInfo 304 w:8:0x00000064,0x01000064,0x000003e8,0x010003e8,0x000003e9,0x010003e9,0x0000044c,0x0100044c,0x000005dc,0x010005dc,0x000007d0,0x010007d0,0x0000ffff,0x0100ffff,0x01000001,0x01000000
GLOBAL stRiscvPara stRiscvPara 51200 w:12616:0,1,2,3
'
MUTATIONS='
tx_isp_t33_mdnsMem.h|bytes = (w * h * 3) >> 1;|bytes = (w * h * 3) >> 2;
tx_isp_t33_mdnsMem.h|(0x5dc00 / r)|(0x5dc00 / (r + 1))
tx_isp_t33_mdnsMem.h|+ 63) >> 6) << 3;|+ 63) >> 6) << 4;
tx_isp_t33_mdnsMem.h|off = (((bytes + 255) >> 8) + 2) << 8;|off = (((bytes + 255) >> 8) + 3) << 8;
tx_isp_t33_mdnsMem.h|st = ((wl + 15) >> 4) << 3;|st = ((wl + 15) >> 4) << 2;
tx_isp_t33_mdnsMem.h|((h + 7) * st) >> 3|((h + 7) * st) >> 4
tx_isp_t33_mdnsMem.h|((w >> 1) + 7) & 0xfff8|((w >> 1) + 7) & 0xfff0
tx_isp_t33_mdnsMem.h|ops->reg_write(chn, 15, mode ? 13 : 0xd050, pa + off);|ops->reg_write(chn, 15, mode ? 13 : 0xd050, pa - off);
tx_isp_t33_mdnsMem.h|if (sw904 == 1)|if (sw904 == 2)
tx_isp_t33_mdnsMem.h|if (r <= 1000)|if (r <= 99)
tx_isp_t33_mdnsMem.h|(v[0x3c1] << 31)|(v[0x3c1] << 30)
tx_isp_t33_mdnsMem.h|(v[0x88e] == 1 ? 0x10000000 : 0)|(v[0x88e] == 1 ? 0x20000000 : 0)
tx_isp_t33_mdnsMem.h|v[0x5d7] & 0x1ff|v[0x5d7] & 0xff
tx_isp_t33_mdnsMem.h|if ((u32)(sw904 - 1) == chn)|if ((u32)(sw904 - 1) != chn)
'
