# t33_binoracle block "refA": block refresh wrappers vs the vendor tx-isp-t33.ko instructions (openimp #99)
SRC=refA.c
FUNCS='
tisp_cdns_refresh          bo_tisp_cdns_refresh          none r:0:3 u32
tisp_rdns_refresh          bo_tisp_rdns_refresh          none r:0:3 u32
tisp_ysp_refresh           bo_tisp_ysp_refresh           none r:0:3 u32
CALLS tisp_cdns_par_refresh:3 tisp_rdns_par_refresh:3 tisp_ysp_par_refresh:3
GLOBAL cdnsInfo cdnsInfo 16 p:0:448 p:4:448 p:8:448 p:12:448
GLOBAL rdnsInfo rdnsInfo 16 p:0:852 p:4:852 p:8:852 p:12:852
GLOBAL yspInfo yspInfo 16 p:0:2188 p:4:2188 p:8:2188 p:12:2188
'
MUTATIONS='
tx_isp_t33_refA.h|st[440 / 4]|st[444 / 4]
tx_isp_t33_refA.h|st[844 / 4]|st[848 / 4]
tx_isp_t33_refA.h|st[2180 / 4]|st[2184 / 4]
tx_isp_t33_refA.h|u32 *st = cdnsInfo[ch];|u32 *st = cdnsInfo[ch ^ 1];
tx_isp_t33_refA.h|u32 *st = rdnsInfo[ch];|u32 *st = rdnsInfo[ch ^ 1];
tx_isp_t33_refA.h|u32 *st = yspInfo[ch];|u32 *st = yspInfo[ch ^ 1];
tx_isp_t33_refA.h|tisp_cdns_par_refresh(ch, inf,|tisp_cdns_par_refresh(ch ^ 1, inf,
tx_isp_t33_refA.h|tisp_rdns_par_refresh(ch, inf,|tisp_rdns_par_refresh(ch ^ 1, inf,
tx_isp_t33_refA.h|tisp_ysp_par_refresh(ch, inf,|tisp_ysp_par_refresh(ch ^ 1, inf,
'
