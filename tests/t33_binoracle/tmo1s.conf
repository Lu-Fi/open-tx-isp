# t33_binoracle block "tmo1s": TMO one-shot / AOV / multi-sensor V-table glue (openimp #99), driver/t32/tx_isp_t33_tmo1s.h.
# The lib_tisp_tmo_oneshot_* wrappers run the vendor's tisp_tmo_oneshot_* (proves both); list pages (stModuleAttr
# +0xe8 / +0x7e8, word 0 = list length) are small random blocks (the slot writes are tisp_reg_write_t33 calls); tmoInfo[0..1] with
# the V table pointer at +0x2a50 and the "started" byte +0x2a5d.
SRC=tmo1s.c
PROVES='tisp_tmo_oneshot_disable tisp_tmo_oneshot_enable tisp_tmo_oneshot_tick'
FUNCS='
CALLS tisp_reg_write_t33:4 tisp_rcfg_module_cfg_trig:2 tisp_tmo_ramV_vi0_reg_refresh:1
GLOBAL stIspInitPar stIspInitPar 4096 w:904:0,1,1,2,2,3,4
GLOBAL tmoCfgMode tmoCfgMode 1 w:0:0,1,1
GLOBAL aovTikFlag aovTikFlag 1 w:0:0,1,1,2
GLOBAL mulsensornum mulsensornum 1 w:0:0,1,1,2
GLOBAL tisp_t33_tmo_rcfg_reg_num tisp_t33_tmo_rcfg_reg_num 2
GLOBAL tmoInfo tmoInfo 8 q:0:0x2a60:b0x2a5d=0,0,1,2:@0x2a50=6000 q:4:0x2a60:b0x2a5d=0,0,1,2:@0x2a50=6000
GLOBAL stModuleAttr stModuleAttr 0xe00 q:0xe8:64 q:0x7e8:64
lib_tisp_tmo_oneshot_disable     bo_lib_tisp_tmo_oneshot_disable     none
lib_tisp_tmo_oneshot_enable      bo_lib_tisp_tmo_oneshot_enable      none
lib_tisp_tmo_oneshot_tick        bo_lib_tisp_tmo_oneshot_tick        none
tisp_tmo_sleep                   bo_tisp_tmo_sleep                   none
tisp_tmo_dma_interrupt           bo_tisp_tmo_dma_interrupt           v0
tisp_tmo_rcfg_reg_num_enV        bo_tisp_tmo_rcfg_reg_num_enV        v0   r:0:1
tisp_tmo_ramV_vi23_reg_ctrl      bo_tisp_tmo_ramV_vi23_reg_ctrl      none r:0:1
tisp_tmo_ramV_vi23_reg_refresh   bo_tisp_tmo_ramV_vi23_reg_refresh   none r:0:1
tisp_tmo_wake_up                 bo_tisp_tmo_wake_up                 none r:0:1
VEC tisp_tmo_rcfg_reg_num_enV 0x100
'
MUTATIONS='
tx_isp_t33_tmo1s.h|		t->wr(0, T33_TMO1S_MOD, T33_TMO1S_R(t, 0x58, 0x70dc), 0);|		t->wr(0, T33_TMO1S_MOD, T33_TMO1S_R(t, 0x58, 0x70dc), 1);
tx_isp_t33_tmo1s.h|		t33_tmo1s_reg_num(t, 1, T33_TMO1S_LIST_SHORT);|		t33_tmo1s_reg_num(t, 0, T33_TMO1S_LIST_SHORT);
tx_isp_t33_tmo1s.h|	if (t33_tmo1s_mode(t) == 2) {|	if (t33_tmo1s_mode(t) >= 2) {
tx_isp_t33_tmo1s.h|	t->wr(1, T33_TMO1S_MOD, T33_TMO1S_R(t, 0x58, 0x70dc), 0x11);|	t->wr(0, T33_TMO1S_MOD, T33_TMO1S_R(t, 0x58, 0x70dc), 0x11);
tx_isp_t33_tmo1s.h|	if (t33_tmo1s_mode(t) != 2)|	if (t33_tmo1s_mode(t) < 2)
tx_isp_t33_tmo1s.h|		*t->mulsensor = 0;|		*t->mulsensor = 1;
tx_isp_t33_tmo1s.h|#define T33_TMO1S_LIST_SHORT	0xc4U|#define T33_TMO1S_LIST_SHORT	0xc5U
tx_isp_t33_tmo1s.h|	t->list(ch & 0xff)[0] = n;|	t->list(ch & 0xff)[1] = n;
tx_isp_t33_tmo1s.h|	if (!t->info(ch)[0x2a5d])|	if (t->info(ch)[0x2a5d])
tx_isp_t33_tmo1s.h|	if (t33_tmo1s_mode(t) > 2 |	if (t33_tmo1s_mode(t) >= 2 
tx_isp_t33_tmo1s.h|*t->mulsensor ? 0x11 : 1);|*t->mulsensor ? 0x11 : 0);
tx_isp_t33_tmo1s.h|	*t->mulsensor = ms != 1;|	*t->mulsensor = ms == 0;
tx_isp_t33_tmo1s.h|	if (t33_tmo1s_mode(t) < 2 |	if (t33_tmo1s_mode(t) < 1 
tx_isp_t33_tmo1s.h|t33_le32(t->info(ch) + 0x2a54);|t33_le32(t->info(ch) + 0x2a50);
tx_isp_t33_tmo1s.h|	u32 base = T33_TMO1S_R(t, 199U, 0x32264U), k;|	u32 base = T33_TMO1S_R(t, 200U, 0x32264U), k;
tx_isp_t33_tmo1s.h|T33_TMO1S_R(t, 0x6a4, 0x32260), 0x10102);|T33_TMO1S_R(t, 0x6a4, 0x32261), 0x10102);
tx_isp_t33_tmo1s.h|	if (m > 2)|	if (m > 3)
tx_isp_t33_tmo1s.h|	if (m == 1) {|	if (m <= 1) {
tx_isp_t33_tmo1s.h|	t->info(ch)[0x2a5d] = 0;|	t->info(ch)[0x2a5d] = 1;
tx_isp_t33_tmo1s.h|	*t->aov_tik = 1;|	*t->aov_tik = 2;
'
