# t33_binoracle block "rdnspar": func_rdns_bin_para_update, func_rdns_para_update, func_cdns_para_update on the
# RDNS / CDNS block state (openimp #99): the vendor reads rdnsInfo[0] / cdnsInfo[0], ours gets the block; the RDNS
# section pointer (rdnsInfo word 0xd0) points at a random section (info W@N).  tisp_reg_read_t33 (BLC / DG list
# slot 3) is recorded and returns list words (CALLS); blcCfgMode / dgCfgMode = 1 (list mode, as our driver).
SRC=rdnspar.c
PROVES='isp_rdns_update_value_ks isp_rdns_itp_update_ks rdns_func_val_lut'
FUNCS='
CALLS tisp_reg_read_t33:3=0,0x12345678,0xffffffff,0x1ff,0x8000,0x1fff0
GLOBAL blcCfgMode blcCfgMode 1 w:0:1
GLOBAL dgCfgMode dgCfgMode 1 w:0:1
func_rdns_bin_para_update  bo_func_rdns_bin_para_update  none info:rdnsInfo:0x350:d0@968
func_rdns_para_update      bo_func_rdns_para_update      none info:rdnsInfo:0x350:46<256,47<256,48<256
func_cdns_para_update      bo_func_cdns_para_update      none info:cdnsInfo:0x1b8
'
MUTATIONS='
tx_isp_t33_rdns.h|	{ 8, 0x33a, 0x52 }|	{ 8, 0x33b, 0x52 }
tx_isp_t33_rdns.h|	{ 0x8a, 0x28, 0, 0 }|	{ 0x8a, 0x29, 0, 0 }
tx_isp_t33_rdns.h|	{ 0xc9, 0x5e, 0, 0 }|	{ 0xc9, 0x5f, 0, 0 }
tx_isp_t33_rdns.h|	v[0xb6] = (dg & 0xffff) >> 4;|	v[0xb6] = (dg & 0xffff) >> 3;
tx_isp_t33_rdns.h|	v[0xb5] = blc & 0xffff;|	v[0xb5] = blc & 0xfff;
tx_isp_t33_rdns.h|	t33_rdns_val_lut((int)v[0x49], v[0x46], &v[0xac]);|	t33_rdns_val_lut((int)v[0x49], v[0x47], &v[0xac]);
tx_isp_t33_rdns.h|5, 9, &v[200]|4, 9, &v[200]
tx_isp_t33_rdns.h|6, 9, &v[0xcd], &v[0xcf]|6, 8, &v[0xcd], &v[0xcf]
tx_isp_t32_cdns.h|		inf[0x36 + k] = inf[k];|		inf[0x35 + k] = inf[k];
'
