# t33_binoracle block "clkp": the T33 clock-parent helper (ispcore_set_clk_parent.isra.10 and
# ivdc_set_clk_parent.isra.8, the same instructions) vs the vendor tx-isp-t33.ko (openimp #99).  The parent
# string is one of "sclka" / "sclk" / "mpll" / "mplla" / "vpll" / "vplla" / random; the device clock returns a
# pointer or an error pointer, clk_set_parent 0 or an error; every clock call and log is recorded (CALLS).
SRC=clkp.c
N=${N:-1000}
PROVES=''
FUNCS='
ispcore_set_clk_parent.isra.10 bo_clkp none buf:4 st:8:0=0x6b6c6373,0x6c6c706d,0x6c6c7076,0x12345678:4=0x61,0,0x6161 u32
ivdc_set_clk_parent.isra.8     bo_clkp none buf:4 st:8:0=0x6b6c6373,0x6c6c706d,0x6c6c7076,0x12345678:4=0x61,0,0x6161 u32
CALLS private_devm_clk_get:2=0x80001000,0xfffff001,0xffffffff,0xfffff000 private_devm_clk_put:2
CALLS clk_get:2@1:6=0x80002000,0x80003000 clk_set_parent:2=0,0xffffffea clk_put:1 isp_printf:3@1:15
'
MUTATIONS='
tx_isp_t33_clkp.h|{ "sclka", "mpll" }|{ "sclka", "vpll" }
tx_isp_t33_clkp.h|	for (k = 0; k < 2; k++)|	for (k = 1; k < 2; k++)
tx_isp_t33_clkp.h|	if ((unsigned long)c >= (unsigned long)-4095)|	if ((unsigned long)c > (unsigned long)-4095)
tx_isp_t33_clkp.h|	else if (k == 2)|	else if (k == 3)
tx_isp_t33_clkp.h|		p = ops->clk_get(0, t33_sclk_name[k]);|		p = ops->clk_get(0, t33_sclk_name[0]);
tx_isp_t33_clkp.h|		ops->clk_put(p);|		ops->clk_put(c);
tx_isp_t33_clkp.h|	ops->devm_clk_put(*devp, c);|	ops->devm_clk_put(*devp, 0);
tx_isp_t33_clkp.h|	if (r)|	if (r > 0)
tx_isp_t33_clkp.h|		ops->log("The %s was not found!\n", parent);|		ops->log("The %s was not found!\n", name);
tx_isp_t33_clkp.h|	return *a == *b;|	return 1;
'
