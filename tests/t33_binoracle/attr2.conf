# t33_binoracle block "attr2": gamma / autozoom / module ratio ioctl attribute wrappers (openimp #99)
# Callees are not run: only the first argument words (user pointer / a0 / printf level) are compared; the
# stack buffer address and the printf format/function/line arguments differ between the two sides by construction.
SRC=attr2.c
PROVES=''
FUNCS='
tx_isp_gamma_g_attr.isra.40        bo_tx_isp_gamma_g_attr        v0   u32 buf:8
tx_isp_gamma_s_attr.isra.8         bo_tx_isp_gamma_s_attr        v0   u32 u32
tx_isp_autozoom_g_attr.isra.42     bo_tx_isp_autozoom_g_attr     v0   u32 buf:8
tx_isp_module_ratio_g_attr.isra.56 bo_tx_isp_module_ratio_g_attr v0   u32 buf:8
tx_isp_module_ratio_s_attr.isra.9  bo_tx_isp_module_ratio_s_attr v0   u32 u32
CALLS tisp_g_Gamma:1=0,0,22 tisp_s_Gamma:1=0,0,22 tisp_g_autozoom_control:1=0,0,22 tisp_g_module_ratio_attr:1=0,0,22 tisp_s_module_ratio_attr:1=0,0,22 private_copy_to_user:1=0,7 private_copy_from_user:0=0,5 isp_printf:1
'
MUTATIONS='
tx_isp_t33_attr2.h|	if (check && ret) {|	if (check && !ret) {
tx_isp_t33_attr2.h|		pr(1, "get attr failed", "attr_g", line1);|		pr(2, "get attr failed", "attr_g", line1);
tx_isp_t33_attr2.h|		pr(2, "copy_to_user failed", "attr_g", line2);|		pr(1, "copy_to_user failed", "attr_g", line2);
tx_isp_t33_attr2.h|t33_le32(user_blk), buf, size);|t33_le32(user_blk + 4), buf, size);
tx_isp_t33_attr2.h|	ret = get(a0, buf);|	ret = get(a0 ^ 1, buf);
tx_isp_t33_attr2.h|	if (ret) {|	if (!ret) {
tx_isp_t33_attr2.h|		pr(2, "copy_from_user failed", "attr_s", line1);|		pr(1, "copy_from_user failed", "attr_s", line1);
tx_isp_t33_attr2.h|	ret = set(a0, buf);|	ret = set(a0 + 1, buf);
tx_isp_t33_attr2.h|		pr(1, "set attr failed", "attr_s", line2);|		pr(2, "set attr failed", "attr_s", line2);
tx_isp_t33_attr2.h|user_blk, 128, 0, 0, 506,|user_blk, 128, 1, 0, 506,
'
