tisp_defog_t33_frame_done_interrupt bo_tisp_defog_t33_frame_done_interrupt v0   u32
tisp_clm_irq_frame_done             bo_tisp_clm_irq_frame_done             v0   u32
CALLS tisp_rcfg_module_cfg_trig:2 tisp_blc_write_reg:0 tisp_clm_t33_write_reg:0
GLOBAL stIspInitPar stIspInitPar 4096 w:904:0,1,2
