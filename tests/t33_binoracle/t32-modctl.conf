# Vendor T32 module (run with T33_OEM_KO = the vendor tx-isp-t32.ko; make target t32_binoracle_modctl, openimp #717).
# tisp_s_module_control: the low 22 bits of the top enable word 0x40, tisp_mdns_start + trigger on a bit 11 change,
# tisp_lce_top_change_state (recorded) on a bit 4 / 10 change (driver/t32/tx_isp_t32_api_ctl.h).
SRC=t32-modctl.c
PROVES=''
FUNCS='
CALLS tisp_reg_write:3 tisp_reg_read:2=0,0x800,0x410,0x10,0x400,0x3fffff,0xffffffff,0x12345679,0x00300004 tisp_lce_top_change_state:1
GLOBAL cfgMode cfgMode 1 w:0:0
VEC tisp_s_module_control 0 0
VEC tisp_s_module_control 0 0x800
VEC tisp_s_module_control 0 0x410
VEC tisp_s_module_control 0 0xffffffff
tisp_s_module_control   bo_tisp_s_module_control   none   r:0:0 u32
'
MUTATIONS='
tx_isp_t32_api_ctl.h|(top & ~T32_TOP_EN_MASK)|(top & T32_TOP_EN_MASK)
tx_isp_t32_api_ctl.h|u32 chg = en ^ top;|u32 chg = en ^ top ^ 0x10;
tx_isp_t32_api_ctl.h|if (chg & T32_TOP_EN_LCE)|if (chg & 0x10)
tx_isp_t32_api_ctl.h|return op->mdns_reg_trig(ch);|return op->mdns_start(ch);
tx_isp_t32_api_ctl.h|u32 addr = shadow ? 2 : 0x40;|u32 addr = shadow ? 2 : 0x44;
tx_isp_t32_api_ctl.h|r = op->reg_write(ch, addr, (en & T32_TOP_EN_MASK)|r = op->reg_write(ch, addr, (en & 0x1fffff)
'
