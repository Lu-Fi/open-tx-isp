# t33_binoracle block "sw-rdns": tisp_rdns_switch_para vs the vendor tx-isp-t33.ko instructions (openimp #99)
# The section pointer (info word 208) is only passed on to the interpolation callees (CALLS, compared by value),
# so it is never dereferenced; the info blocks are p: buffers behind rdnsInfo[0..3].
SRC=sw-rdns.c
PROVES=''
FUNCS='
tisp_rdns_switch_para bo_tisp_rdns_switch_para none r:0:3
CALLS func_rdns_bin_para_update:1 func_rdns_para_update:1 tisp_ev_intp_uint8_t:3=0x11,0x2a5,7,0xff tisp_simple_intp_uint8_t:3=0x3c,0x101,9,0x7fffffff,0x80 tisp_rcfg_get_dma_state:1=0,1 tisp_reg_write_t33:4
GLOBAL rdnsInfo rdnsInfo 16 p:0:864 p:4:864 p:8:864 p:12:864
GLOBAL rdnsCfgMode rdnsCfgMode 1 w:0:0,1,0x80
GLOBAL tispRdnsRefresh tispRdnsRefresh 1
VEC tisp_rdns_switch_para 0
VEC tisp_rdns_switch_para 1
VEC tisp_rdns_switch_para 2
VEC tisp_rdns_switch_para 3
'
MUTATIONS='
tx_isp_t33_swrdns.h|	if (tisp_rcfg_get_dma_state(3)) {|	if (tisp_rcfg_get_dma_state(2)) {
tx_isp_t33_swrdns.h|		tispRdnsRefresh = 2;|		tispRdnsRefresh = 3;
tx_isp_t33_swrdns.h|	tispRdnsRefresh = 1;|	tispRdnsRefresh = 0;
tx_isp_t33_swrdns.h|		inf[90 + k] = |		inf[91 + k] = 
tx_isp_t33_swrdns.h|sec + 834 + 11 * k|sec + 835 + 11 * k
tx_isp_t33_swrdns.h|	ev = sec + 924;|	ev = sec + 920;
tx_isp_t33_swrdns.h|sec + 6 + 11 * k|sec + 7 + 11 * k
tx_isp_t33_swrdns.h|	for (k = 0; k < 74; k++)|	for (k = 0; k < 73; k++)
tx_isp_t33_swrdns.h|	i = (int)gain >> 16;|	i = (int)gain >> 15;
tx_isp_t33_swrdns.h|	f = gain & 0xffff;|	f = gain & 0x7fff;
tx_isp_t33_swrdns.h|rdnsCfgMode ? slot|!rdnsCfgMode ? slot
tx_isp_t33_swrdns.h|	t33_rdns_wr(c, 9, 0x60b8,|	t33_rdns_wr(c, 10, 0x60b8,
tx_isp_t33_swrdns.h|((v[205] & 0x3f) << 16)|((v[205] & 0x1f) << 16)
tx_isp_t33_swrdns.h|((v[180] & 1) << 24)|((v[180] & 3) << 24)
tx_isp_t33_swrdns.h|	t33_rdns_wr(c, 1, 0x6020, 1);|	t33_rdns_wr(c, 1, 0x6020, 2);
tx_isp_t33_swrdns.h|	func_rdns_bin_para_update(c);|	func_rdns_bin_para_update(0);
tx_isp_t33_swrdns.h|t33_rdns_pack6(v + 136 + 4 * k)|t33_rdns_pack6(v + 132 + 4 * k)
tx_isp_t33_swrdns.h|	t33_rdns_wr(c, 43, 0x60a4, v[195] & 0xff);|	t33_rdns_wr(c, 43, 0x60a4, v[195] & 0x7f);
'
