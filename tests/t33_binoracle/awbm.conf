# t33_binoracle block "awbm": tisp_awb_malloc_info vs the vendor tx-isp-t33.ko (split from aemisc: the vendor writes through
# the first kmalloc result unchecked, so kmalloc here never returns NULL: both sides would only fault identically)
SRC=awbm.c
PROVES=''
FUNCS='
tisp_awb_malloc_info       bo_tisp_awb_malloc_info       none r:0:3
GLOBAL stAwbStatBuff stAwbStatBuff 16 w:0:0,0x1000 w:4:0,0x1000 w:8:0,0x1000 w:12:0,0x1000
GLOBAL awbInfo awbInfo 16 q:0:16:@8=160 q:4:16:@8=160 q:8:16:@8=160 q:12:16:@8=160
CALLS private_kmalloc:2=^0x70000c00,0x70000d00 private_kfree:1 isp_printf:1 tisp_reg_write_t33:4
'
MUTATIONS='
tx_isp_t33_aemisc.h|o->kmalloc(12, T33_AEM_GFP)|o->kmalloc(16, T33_AEM_GFP)
tx_isp_t33_aemisc.h|blk[2] = 4;|blk[2] = 5;
tx_isp_t33_aemisc.h|aux[126] = (u8)(blk[2] - 1);|aux[126] = (u8)(blk[2] - 2);
tx_isp_t33_aemisc.h|aux[127] = 0;|aux[127] = 1;
tx_isp_t33_aemisc.h|blk[0] = blk[1] + 0x80000000U;|blk[0] = blk[1] + 0x80000001U;
tx_isp_t33_aemisc.h|0xe800 + 29696|0xe800 + 29697
tx_isp_t33_aemisc.h|	aux[143] = 0;|	aux[143] = 1;
tx_isp_t33_aemisc.h|o->reg_write(c, 29, 11, blk[0]);|o->reg_write(c, 29, 12, blk[0]);
tx_isp_t33_aemisc.h|o->reg_write(c, 29, 12, blk[0] + 29696);|o->reg_write(c, 29, 12, blk[0] + 29697);
tx_isp_t33_aemisc.h|o->reg_write(c, 29, 14, blk[0] + 0xe800 + 29696);|o->reg_write(c, 29, 13, blk[0] + 0xe800 + 29696);
'
