# t33_binoracle block "irqB": frame-done IRQ handlers vs the vendor tx-isp-t33.ko instructions (openimp #99)
SRC=irqB.c
PROVES=''
FUNCS='
tisp_csc_fra_down_interrupt  bo_tisp_csc_fra_down_interrupt  v0  r:0:3
tisp_gsm_irq_frmae_done      bo_tisp_gsm_irq_frmae_done      v0  r:0:3
tisp_gamma_irq_frame_done    bo_tisp_gamma_irq_frame_done    v0  r:0:3
tisp_lsc_irq_frame_done      bo_tisp_lsc_irq_frame_done      v0  r:0:3
CALLS tisp_rcfg_module_cfg_trig:2 tisp_t33_csc_write_reg:1 tisp_rcfg_get_dma_state:1=0,1 tisp_gamma_write_lut_rgb:1 tisp_lsc_write_reg:2
GLOBAL stIspInitPar stIspInitPar 4032 w:904:0,1,1,2
GLOBAL tispCscRefresh tispCscRefresh 4 w:0:0,1,2,3
GLOBAL tispGammaRefresh tispGammaRefresh 4 w:0:0,1,2,3
GLOBAL tispLscRefresh tispLscRefresh 4 w:0:0,1,2,3
GLOBAL gsm_count gsm_count 16
GLOBAL gamma_count gamma_count 16
GLOBAL lsc_count lsc_count 16
GLOBAL lsc_para lsc_para 16 q:0:32:b24=0,1 q:4:32:b24=0,1 q:8:32:b24=0,1 q:12:32:b24=0,1
'
MUTATIONS='
tx_isp_t33_irqB.h|tisp_rcfg_module_cfg_trig(ch & 0xff, 13);|tisp_rcfg_module_cfg_trig(ch & 0xff, 12);
tx_isp_t33_irqB.h|tispCscRefresh == 2|tispCscRefresh == 3
tx_isp_t33_irqB.h|gsm_count[ch] += 1;|gsm_count[ch] += 2;
tx_isp_t33_irqB.h|+ 1) & 0xffffff;|+ 1) & 0xfffff;
tx_isp_t33_irqB.h|tisp_rcfg_get_dma_state(11) == 0|tisp_rcfg_get_dma_state(10) == 0
tx_isp_t33_irqB.h|tispGammaRefresh == 2|tispGammaRefresh == 3
tx_isp_t33_irqB.h|+ 1) & 0xffff;|+ 1) & 0xfff;
tx_isp_t33_irqB.h|tisp_lsc_write_reg(ch, 2);|tisp_lsc_write_reg(ch, 3);
tx_isp_t33_irqB.h|tisp_rcfg_module_cfg_trig(ch & 0xff, 6);|tisp_rcfg_module_cfg_trig(ch & 0xff, 7);
tx_isp_t33_irqB.h|tispLscRefresh == 2|tispLscRefresh == 3
tx_isp_t33_irqB.h|tisp_rcfg_module_cfg_trig(ch & 0xff, 11);|tisp_rcfg_module_cfg_trig(ch & 0xff, 12);
'
