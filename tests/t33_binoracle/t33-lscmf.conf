# Vendor T33 module (make target t33_binoracle_lscmf, openimp #727).
# tisp_lsc_mirror_flip -> do_mirror_flip: the line / element exchange of the three planes of every CT table
# (t33_lsc_mirror_flip / t33_lsc_do_mirror_flip, driver/t32/tx_isp_t33_lscmf.h), the counters + flip / + mirror,
# parameter word 3 = 0xff, interp_by_ct(ch, CT, 1), func_lsc_para_update, write_reg(ch, 2) and the message
# (the flow of tx_isp_t32_hw.c t33_lsc_hvflip; #728: through t33_lsc_mf_delta from the unflipped state, flip / mirror
# 0 / 1 as the 0x73 dispatcher passes them: with 2 only the counters differ, they count exchanges).
SRC=t33-lscmf.c
PROVES='t33_lsc_do_mirror_flip'
FUNCS='
CALLS tisp_lsc_interp_by_ct:3 func_lsc_para_update:1 tisp_lsc_write_reg:2 isp_printf:1
GLOBAL lsc_para lsc_para 16 q:0:196:@0=152/148=0,1,2,3:@4=32:@8=52/10=0,1,2,3,17,33,48/11=0,1,2,5,17,33,48:@12=12
GLOBAL stLutInfo stLutInfo 16 q:0:24:@20=41480f
VEC tisp_lsc_mirror_flip 0 0 0 1 0
VEC tisp_lsc_mirror_flip 0 0 0 0 1
VEC tisp_lsc_mirror_flip 0 0 0 1 1
VEC tisp_lsc_mirror_flip 0 0 0 0 0
tisp_lsc_mirror_flip   bo_tisp_lsc_mirror_flip   none   r:0:0 u32 u32 r:0:1 r:0:1
'
MUTATIONS='
tx_isp_t33_lscmf.h|for (i = 0; i < lines / 2; i++) {|for (i = 0; i <= lines / 2; i++) {
tx_isp_t33_lscmf.h|b = p + 2 * (lines - 1 - i) * cols;|b = p + 2 * (lines - i) * cols;
tx_isp_t33_lscmf.h|for (j = 0; j < cols / 2; j++) {|for (j = 0; j + 1 < cols / 2; j++) {
tx_isp_t33_lscmf.h|b = l + 2 * (cols - 1 - j);|b = l + 2 * (cols - j);
tx_isp_t33_lscmf.h|t33_lsc_do_mirror_flip(p + 2 * T33_LSCMF_PLANE, lines, cols, flip, mirror);|(void)0;
tx_isp_t33_lscmf.h|cnt[8] = (u8)(cnt[8] + flip);|cnt[8] = (u8)(cnt[8] + 1);
tx_isp_t33_lscmf.h|par[12] = 0xff;|par[12] = 5;
tx_isp_t33_lscmf.h|int lines = info[10], cols = info[11];|int lines = info[11], cols = info[10];
tx_isp_t33_lscmf.h|ops->write_reg(ch, 2);|ops->write_reg(ch, 0);
tx_isp_t33_lscmf.h|u8 *p = tab + 2 + t * T33_LSCMF_TABLE;|u8 *p = tab + t * T33_LSCMF_TABLE;
'
