# t33_binoracle block "deinitto": tisp_all_reset with the register reads held per case (=^, by case and register): the stop ack never /
# always comes, the core state stays 0 (both 20000-read timeouts) or is nonzero at once (openimp #99).  Same wrapper
# as block deinit.
SRC=deinit.c
N=12
MUT_N=12	# 20000-read polls: few cases (also when run.sh is called with a large MUT_N)
PROVES=''
FUNCS='
tisp_all_reset         bo_all_reset v0
CALLS system_reg_read:1=^0,1,1,0,2 system_reg_write:2 isp_printf:4@1:20@2:14=0,5
'
MUTATIONS='
tx_isp_t33_deinit.h|#define T33_RST_POLLS		20000U|#define T33_RST_POLLS		19999U
tx_isp_t33_deinit.h|			return d->log(2, 289);|			return d->log(2, 288);
tx_isp_t33_deinit.h|			d->log(2, 301);|			d->log(2, 300);
tx_isp_t33_deinit.h|			break;|			return 0;
'
