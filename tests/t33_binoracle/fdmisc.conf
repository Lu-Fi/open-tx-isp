# tisp_mdns_t33_reg_trig, tisp_get_rcfg_module vs the vendor tx-isp-t33.ko (openimp #99).  The list starts
# (tisp_rcfg_module_cfg_trig), the TOP rewrite (tisp_top_reg_write) and the MDNS slot write are recorded (CALLS).
SRC=fdmisc.c
