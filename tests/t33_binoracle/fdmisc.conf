tisp_msca_t33_frame_done_interrupt   bo_msca_fd          v0   r:0:300
tisp_top_t33_pipe_null_down_interrupt bo_top_pnd         v0   r:0:300
tisp_mdns_t33_reg_trig               bo_mdns_trig        none r:0:300
