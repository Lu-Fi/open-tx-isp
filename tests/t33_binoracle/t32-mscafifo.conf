# Vendor T32 module (run with T33_OEM_KO = the vendor tx-isp-t32.ko; make target t32_binoracle_mscafifo).
# tisp_msca_addr_fifo_read: both done address words with the low three bits dropped (openimp #529).
SRC=t32-mscafifo.c
PROVES=''
FUNCS='
CALLS tisp_reg_read:2=0xffffffff,0x12345679,5,0,0x03975001 system_reg_read:1=0xffffffff,0x12345679,7,0,0x03975001
GLOBAL cfgMode bo_cfg_mode 1 w:0:0,1
tisp_msca_addr_fifo_read   bo_tisp_msca_addr_fifo_read   none u32 u32 out:4 out:4
'
MUTATIONS='
tx_isp_t32_msca_done.h|((v) & ~7U)|((v) & ~3U)
tx_isp_t32_msca_done.h|((v) & ~7U)|((v) & ~0xfU)
tx_isp_t32_msca_done.h|((v) & ~7U)|(v)
tx_isp_t32_msca_fifo.h|(f << 5) + 52|(f << 5) + 56
tx_isp_t32_msca_fifo.h|(f << 5) + 60|(f << 5) + 62
tx_isp_t32_msca_fifo.h|0xf0138 + (f << 8)|0xf0130 + (f << 8)
tx_isp_t32_msca_fifo.h|0xf0158 + (f << 8)|0xf0150 + (f << 8)
'
