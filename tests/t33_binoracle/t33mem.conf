# t33_binoracle block "t33mem": tisp_mdns_t33_get_mem_size (T33 ISP working memory size, GET_ISP_MEM_INFO) vs the
# vendor tx-isp-t33.ko (openimp #99): ratio from stMemInfo[ch] +8 (u16, edge values 1000/1001/2000/2001 and junk
# high halves), result stored at +0x20; ratio > 2000 = error + isp_printf (CALLS), printk is the no-op HLE.
SRC=t33mem.c
PROVES=''
FUNCS='
CALLS isp_printf:1
GLOBAL stMemInfo stMemInfo 304 w:8:0,1,500,999,1000,1001,1500,1999,2000,2001,3000,0x12345,0xffff03e8 w:84:0,1000,1001,2000,2001 w:160:1500,2500 w:236:0,1200
tisp_mdns_t33_get_mem_size bo_mdns_t33_get_mem_size v0 r:0:3 r:0:65535 r:0:65535 r:0:2 r:0:255
VEC tisp_mdns_t33_get_mem_size 0 1920 1080 0 0
VEC tisp_mdns_t33_get_mem_size 0 1920 1080 1 0
VEC tisp_mdns_t33_get_mem_size 0 2560 1440 0 3
'
MUTATIONS='
tx_isp_t33_mem.h|(int)(w * h * 3) / 2 + 0xff|(int)(w * h * 3) / 2 + 0xfe
tx_isp_t33_mem.h|if (memopt <= 1000)|if (memopt < 1000)
tx_isp_t33_mem.h|} else if (memopt <= 2000) {|} else if (memopt < 2000) {
tx_isp_t33_mem.h|(u32)((int)(w + 31) >> 5)|(u32)((int)(w + 32) >> 5)
tx_isp_t33_mem.h|0x5dc00 / (int)memopt|0x5d800 / (int)memopt
tx_isp_t33_mem.h|+ 0x3f) >> 6) << 3)|+ 0x3f) >> 5) << 3)
tx_isp_t33_mem.h|+ 15) >> 4) << 3) * (h + 7)|+ 15) >> 4) << 3) * (h + 6)
tx_isp_t33_mem.h|t += (z + 2) << 8;|t += (z + 1) << 8;
tx_isp_t33_mem.h|if ((sel & 0xff) != 1)|if ((sel & 0xff) == 0)
tx_isp_t33_mem.h|(((w >> 1) + 7) & 0xfff8)|(((w >> 1) + 7) & 0xfff0)
tx_isp_t33_mem.h|((pad_mb & 0xff) << 20)|((pad_mb & 0x7f) << 20)
tx_isp_t33_mem.h|((0x1000 - (t & 0xfff)) & 0xffff)|((0x1000 - (t & 0xfff)) & 0xfff)
tx_isp_t33_mem.h|z = (u32)(((int)(w * h * 3) / 2|z = (u32)(((w * h * 3) / 2
