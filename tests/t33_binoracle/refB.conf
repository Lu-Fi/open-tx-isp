# t33_binoracle block "refB": per-channel refresh entry points vs the vendor tx-isp-t33.ko instructions
SRC=refB.c
PROVES=''
FUNCS='
tisp_ydns_refresh          bo_tisp_ydns_refresh          v0   r:0:3 u32
tisp_sdns_refresh          bo_tisp_sdns_refresh          v0   r:0:3 u32
tisp_dmsc_refresh          bo_tisp_dmsc_refresh          v0   r:0:3 u32
CALLS tisp_ydns_par_refresh:3 tisp_sdns_par_refresh:3 tisp_dmsc_par_refresh:3
GLOBAL ydnsInfo ydnsInfo 16 q:0:104 q:4:104 q:8:104 q:12:104
GLOBAL sdnsInfo sdnsInfo 16 q:0:156 q:4:156 q:8:156 q:12:156
GLOBAL dmscInfo dmscInfo 16 q:0:2696 q:4:2696 q:8:2696 q:12:2696
VEC tisp_ydns_refresh 0 1
VEC tisp_ydns_refresh 1 2
VEC tisp_ydns_refresh 2 3
VEC tisp_ydns_refresh 3 4
VEC tisp_sdns_refresh 0 1
VEC tisp_sdns_refresh 1 2
VEC tisp_sdns_refresh 2 3
VEC tisp_sdns_refresh 3 4
VEC tisp_dmsc_refresh 0 1
VEC tisp_dmsc_refresh 1 2
VEC tisp_dmsc_refresh 2 3
VEC tisp_dmsc_refresh 3 4
'
MUTATIONS='
tx_isp_t33_refB.h|	return 0;|	return 1;
tx_isp_t33_refB.h|	par_refresh(ch, a1, v[T33_YDNS_GAIN_OFF >> 2]);|	par_refresh(ch + 1, a1, v[T33_YDNS_GAIN_OFF >> 2]);
tx_isp_t33_refB.h|	par_refresh(ch, a1, v[T33_YDNS_GAIN_OFF >> 2]);|	par_refresh(ch, a1, v[T33_YDNS_GAIN_OFF >> 2] + 1);
tx_isp_t33_refB.h|	par_refresh(ch, a1, v[T33_SDNS_GAIN_OFF >> 2]);|	par_refresh(ch + 1, a1, v[T33_SDNS_GAIN_OFF >> 2]);
tx_isp_t33_refB.h|	par_refresh(ch, a1, v[T33_SDNS_GAIN_OFF >> 2]);|	par_refresh(ch, a1 + 1, v[T33_SDNS_GAIN_OFF >> 2]);
tx_isp_t33_refB.h|	par_refresh(ch, a1, v[T33_DMSC_GAIN_OFF >> 2]);|	par_refresh(ch + 1, a1, v[T33_DMSC_GAIN_OFF >> 2]);
tx_isp_t33_refB.h|	par_refresh(ch, a1, v[T33_DMSC_GAIN_OFF >> 2]);|	par_refresh(ch, a1, v[T33_DMSC_GAIN_OFF >> 2] + 1);
tx_isp_t33_refB.h|#define T33_YDNS_GAIN_OFF	100|#define T33_YDNS_GAIN_OFF	104
tx_isp_t33_refB.h|#define T33_SDNS_GAIN_OFF	152|#define T33_SDNS_GAIN_OFF	148
tx_isp_t33_refB.h|#define T33_DMSC_GAIN_OFF	2692|#define T33_DMSC_GAIN_OFF	2688
'
